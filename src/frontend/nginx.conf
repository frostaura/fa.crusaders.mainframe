# ---- Search indexing ----
#
# A members' club app: only the public page and the ways in may be indexed (src/lib/seoHead.ts
# INDEXABLE_PATHS — seo-posture.test.ts holds this list, robots.txt and sitemap.xml to it). Every
# other document — the signed-in app, every /admin page and every invite link (/j/{token}, whose
# token is private) — is sent `X-Robots-Tag: noindex, nofollow`. A header rather than only a meta
# tag because the SPA serves one index.html and crawlers that run no script never see the meta the
# app sets. Keyed on $request_uri (the path as asked, query stripped below), because the fallback
# is an internal redirect and $uri is /index.html by the time the header is added. An empty value
# sends no header at all.
map $request_uri $robots_tag {
    default                                                          "noindex, nofollow";
    ~^/(?:login|register|forgot-password|how-it-works)?(?:\?.*)?$    "";
}

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;

    # ---- Compression (perf round, 2026-09-30) ----
    #
    # The 801 KB entry chunk went out raw (241 KB gzipped). JS, CSS, SVG, the manifest and the
    # TTF fonts compress well; WOFF/WOFF2 and the raster images are compressed formats already
    # and are left alone. text/html is always compressed once gzip is on. `gzip_proxied any`
    # because every request here arrives through the gateway. The gateway passes these
    # responses through as they are (nginx/nginx.conf).
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        application/javascript text/javascript text/css image/svg+xml font/ttf
                      application/manifest+json application/json text/plain;

    # ---- Security headers ----
    #
    # This image serves the document, so this is the hop that actually decides whether the
    # signed-in app can be framed. It could be, by any origin: a headed pass loaded
    # <iframe src="…/schedule"> from a different origin and got the header, the live booking grid
    # and the member's balance chip, with nothing to stop a transparent decoy collecting the
    # click on "Book for 50.00 cr" — or, for an admin, on "Adjust credit" and "Regenerate key".
    #
    # nginx does NOT merge add_header across levels: one add_header inside a location discards
    # every inherited one. Each location below that sets a header of its own therefore repeats
    # these four verbatim. Adding a fifth means editing every block.
    #
    # The gateway (nginx/nginx.conf) hides the upstream copy and re-adds the same values, so a
    # request through the full chain still carries exactly one of each.
    add_header X-Frame-Options         "DENY"        always;
    add_header X-Content-Type-Options  "nosniff"     always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Referrer-Policy         "no-referrer" always;

    # SPA routing — serve index.html for any unknown path.
    #
    # P4-2 (review round 4): the document and the build's chunk list are revalidated on every use.
    # With no Cache-Control a browser caches index.html HEURISTICALLY (10 % of its age: ~17 hours for
    # a week-old build), and a stale document names chunk files a deploy has deleted — a page that
    # loads nothing. `no-cache` still lets the browser keep a copy and ask with its ETag (a 304 is a
    # few bytes). The fallback below is an internal redirect, so a deep link lands in the
    # `= /index.html` block and gets the same header.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag $robots_tag always;
        add_header X-Frame-Options         "DENY"        always;
        add_header X-Content-Type-Options  "nosniff"     always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Referrer-Policy         "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag $robots_tag always;
        add_header X-Frame-Options         "DENY"        always;
        add_header X-Content-Type-Options  "nosniff"     always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Referrer-Policy         "no-referrer" always;
        try_files $uri =404;
    }

    # The build's chunk list (vite.config.ts `precacheManifest`): un-hashed and rewritten by every
    # build, so it is revalidated like the document it describes.
    location = /precache.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options         "DENY"        always;
        add_header X-Content-Type-Options  "nosniff"     always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Referrer-Policy         "no-referrer" always;
        try_files $uri =404;
    }

    # The service worker, which the asset regex below would otherwise match.
    #
    # It did: /sw.js came back with `Expires: +1y` AND two Cache-Control values —
    # `max-age=31536000` from `expires` and `public, immutable` from the add_header. The one file
    # in the build that must never be long-cached was being cached for a year. It survived only
    # because Chrome's default updateViaCache="imports" fetches the worker script past the HTTP
    # cache; one caching proxy, or one updateViaCache change, and a club is pinned to a stale
    # worker for a year with no way to push a fix.
    #
    # An exact-match location beats the regex below regardless of order.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options         "DENY"        always;
        add_header X-Content-Type-Options  "nosniff"     always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Referrer-Policy         "no-referrer" always;
        try_files $uri =404;
    }

    # The theme boot script: un-hashed, run in <head> before first paint, so it must never be
    # held by the year-long immutable rule below or a theme fix would never reach a phone.
    location = /theme-boot.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options         "DENY"        always;
        add_header X-Content-Type-Options  "nosniff"     always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Referrer-Policy         "no-referrer" always;
        try_files $uri =404;
    }

    # The manifest, which nginx's mime map does not know and was serving as
    # application/octet-stream. Chrome parses it anyway; the registered type is
    # application/manifest+json, and a browser that does not guess gets no manifest at all.
    # The empty `types` block is what lets `default_type` apply to a file with an extension.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options         "DENY"        always;
        add_header X-Content-Type-Options  "nosniff"     always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Referrer-Policy         "no-referrer" always;
        try_files $uri =404;
    }

    # The icons, the share image, robots.txt and the sitemap: un-hashed, so revalidated like the
    # document rather than held by the year-long immutable rule below. They were held by it, and a
    # browser that cached the old generic favicon kept it for a year (index.html's ?v= busts those
    # copies once). A regex location; it must stay ABOVE the hashed-asset one, which matches first
    # otherwise. nginx's mime map types .ico (image/x-icon), .png, .svg, .txt and .xml correctly.
    location ~ ^/(?:favicon\.(?:svg|ico)|apple-touch-icon\.png|icon-[a-z0-9-]+\.png|og-image\.png|robots\.txt|sitemap\.xml)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options         "DENY"        always;
        add_header X-Content-Type-Options  "nosniff"     always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Referrer-Policy         "no-referrer" always;
        try_files $uri =404;
    }

    # Long-cache hashed static assets.
    #
    # One Cache-Control, not `expires` plus an add_header: that pair emitted the header twice with
    # different values, which is malformed output from the file that is baked into the image.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options         "DENY"        always;
        add_header X-Content-Type-Options  "nosniff"     always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Referrer-Policy         "no-referrer" always;
        try_files $uri =404;
    }
}
