server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;

    # ---- Security headers ----
    #
    # This image serves the document, so this is the hop that actually decides whether the
    # signed-in app can be framed. It could be, by any origin: a headed pass loaded
    # <iframe src="…/schedule"> from a different origin and got the header, the live booking grid
    # and the member's balance chip, with nothing to stop a transparent decoy collecting the
    # click on "Book for 50.00 cr" — or, for an admin, on "Adjust credit" and "Regenerate key".
    #
    # nginx does NOT merge add_header across levels: one add_header inside a location discards
    # every inherited one. Each location below that sets a header of its own therefore repeats
    # these four verbatim. Adding a fifth means editing every block.
    #
    # The gateway (nginx/nginx.conf) hides the upstream copy and re-adds the same values, so a
    # request through the full chain still carries exactly one of each.
    add_header X-Frame-Options         "DENY"        always;
    add_header X-Content-Type-Options  "nosniff"     always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Referrer-Policy         "no-referrer" always;

    # SPA routing — serve index.html for any unknown path
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker, which the asset regex below would otherwise match.
    #
    # It did: /sw.js came back with `Expires: +1y` AND two Cache-Control values —
    # `max-age=31536000` from `expires` and `public, immutable` from the add_header. The one file
    # in the build that must never be long-cached was being cached for a year. It survived only
    # because Chrome's default updateViaCache="imports" fetches the worker script past the HTTP
    # cache; one caching proxy, or one updateViaCache change, and a club is pinned to a stale
    # worker for a year with no way to push a fix.
    #
    # An exact-match location beats the regex below regardless of order.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options         "DENY"        always;
        add_header X-Content-Type-Options  "nosniff"     always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Referrer-Policy         "no-referrer" always;
        try_files $uri =404;
    }

    # The theme boot script: un-hashed, run in <head> before first paint, so it must never be
    # held by the year-long immutable rule below or a theme fix would never reach a phone.
    location = /theme-boot.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options         "DENY"        always;
        add_header X-Content-Type-Options  "nosniff"     always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Referrer-Policy         "no-referrer" always;
        try_files $uri =404;
    }

    # The manifest, which nginx's mime map does not know and was serving as
    # application/octet-stream. Chrome parses it anyway; the registered type is
    # application/manifest+json, and a browser that does not guess gets no manifest at all.
    # The empty `types` block is what lets `default_type` apply to a file with an extension.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options         "DENY"        always;
        add_header X-Content-Type-Options  "nosniff"     always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Referrer-Policy         "no-referrer" always;
        try_files $uri =404;
    }

    # Long-cache hashed static assets.
    #
    # One Cache-Control, not `expires` plus an add_header: that pair emitted the header twice with
    # different values, which is malformed output from the file that is baked into the image.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options         "DENY"        always;
        add_header X-Content-Type-Options  "nosniff"     always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Referrer-Policy         "no-referrer" always;
        try_files $uri =404;
    }
}
