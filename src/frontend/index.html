<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <!--
      The crest, generated from brand/crest.svg by `npm run icons` (tools/generate-icons.mjs).
      The ?v= busts copies the frontend image used to cache for a year as "immutable"; the icons
      are revalidated now (nginx.conf), so bump it only if that ever changes back.
    -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Two themes (D7). `color-scheme` tells the browser both exist, so native controls,
      scrollbars and the canvas follow whichever is active. The two `theme-color` metas tint the
      browser chrome to bg.app per OS scheme; theme-boot.js pins both to the member's explicit
      choice when there is one. The manifest's theme_color is the light value — an installed
      PWA's splash has no media query. `pwa-posture.test.ts` holds all three to the tokens.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8FAFC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A1220" />
    <!--
      Blocking and external, before any stylesheet: it sets `html.dark` so the first frame is
      already in the right theme. External (not inline) so a strict CSP needs no hash for it;
      tiny, so the block costs nothing a member can see.
    -->
    <script src="/theme-boot.js"></script>
    <!--
      Installable, per docs/specs/feature-spec.md §12. The manifest is what Android and desktop
      Chrome read; the apple-* tags are what iOS reads instead, because Safari still ignores the
      manifest's display and icon fields when a member taps "Add to Home Screen".
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Crusaders" />
    <meta name="application-name" content="Crusaders Squash" />
    <meta name="format-detection" content="telephone=no" />
    <!--
      Search and share. Every fact here is on the club's public page (src/pages/Home.tsx) — no
      invented phone, hours or handles. The canonical and the robots meta are set per route at
      runtime (src/lib/seoHead.ts); the private paths are also noindex by header (nginx.conf) and
      disallowed in robots.txt. og:* and twitter:* are what WhatsApp, iMessage and Slack draw for
      a shared link, invite links (/j/{token}) included; those crawlers run no script, so the tags
      are static and describe the club, never the invite.
    -->
    <title>Crusaders Squash Club — Durban North</title>
    <meta name="description" content="Squash at Northwood Crusaders Sports Club, Durban North: four glass-back courts and thirteen league teams. Members book courts, buy court minutes and switch on the lights here." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Crusaders Squash" />
    <meta property="og:title" content="Crusaders Squash Club — Durban North" />
    <meta property="og:description" content="Four glass-back courts at Northwood Crusaders Sports Club. Book a court and switch on the lights." />
    <meta property="og:url" content="https://crusaders.frostaura.net/" />
    <meta property="og:image" content="https://crusaders.frostaura.net/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Crusaders Squash crest — a navy shield with a red cross — beside the words Crusaders Squash, Durban North." />
    <meta property="og:locale" content="en_ZA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Crusaders Squash Club — Durban North" />
    <meta name="twitter:description" content="Four glass-back courts at Northwood Crusaders Sports Club. Book a court and switch on the lights." />
    <meta name="twitter:image" content="https://crusaders.frostaura.net/og-image.png" />
    <meta name="twitter:image:alt" content="The Crusaders Squash crest — a navy shield with a red cross — beside the words Crusaders Squash, Durban North." />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SportsActivityLocation",
        "name": "Crusaders Squash Club",
        "description": "Squash at Northwood Crusaders Sports Club: four glass-back courts.",
        "url": "https://crusaders.frostaura.net/",
        "logo": "https://crusaders.frostaura.net/icon-512.png",
        "image": "https://crusaders.frostaura.net/og-image.png",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "10 Ranleigh Crescent",
          "addressLocality": "Durban North",
          "addressRegion": "KwaZulu-Natal",
          "postalCode": "4051",
          "addressCountry": "ZA"
        },
        "hasMap": "https://maps.google.com/?cid=12190854373719358442",
        "containedInPlace": { "@type": "SportsClub", "name": "Northwood Crusaders Sports Club" },
        "sameAs": ["https://www.facebook.com/northwoodcrusaders/", "https://www.instagram.com/northwoodcrusaderssport/"]
      }
    </script>
  </head>
  <body class="bg-bg-app text-text-primary font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
