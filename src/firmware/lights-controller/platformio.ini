; Crusaders Mainframe — Lights Controller (ESP32 + 6-channel relay)
;
; Build:    pio run
; Upload:   pio run -t upload
; Monitor:  pio device monitor
;
; Configure WiFi + shared secret in src/secrets.h before flashing.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DRELAY_PINS_4="{16,17,18,19}"
    -DRELAY_PINS_6="{16,17,18,19,21,22}"
