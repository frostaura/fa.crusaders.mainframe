# /etc/systemd/system.conf.d/court-box-watchdog.conf
#
# The SoC's hardware watchdog (bcm2835-wdt / RP1), fed by systemd itself. If the
# kernel or PID 1 hangs, the board resets in 15 s — and from reset the SoC pulls
# every relay GPIO down, so every court goes dark. 15 s is the bcm2835 maximum.
[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=2min
