; Crusaders Mainframe — the COURT BOX firmware (src/iot/court-box).
;
; One of the firmware projects under src/iot. The device-agnostic libraries it
; builds on are NOT in this directory: they live in ../shared/lib and arrive
; through `lib_extra_dirs` below. Anything in this project's own lib/ is true of
; THIS hardware — the Mega<->ESP serial dialect, the relay timer, the court
; abstraction, the bridge's scan flow — and belongs nowhere else.
;
; The court box is a WeMos Mega 2560 + onboard ESP8266. The Mega is a generic
; renderer and relay guard and every piece of volatile logic lives on the
; ESP8266. Both halves are updated only by cable, at the box. The Mega can never
; be updated over WiFi (its ESP sits on Serial3, not the bootloader port), so its
; 3.0.0 image bounds every timeout itself and takes every hardware fact as a
; runtime setting (founder, 2026-11-13).
;
; THIS FILE IS THE TESTED BUILD; IT IS NOT THE DEPLOYMENT ROUTE. The box is
; flashed from the Arduino IDE, out of the generated sketch folders in
; src/iot/court-box/arduino/ — open the sketch, pick the board and the port, Upload.
; `make arduino-export` writes those folders from these sources and from the
; `-D` flags below; `make arduino-check` regenerates and fails on a diff, so a
; flag added here and not exported is a red build rather than a box running
; firmware nobody wrote. `make flash-mega` / `make flash-bridge` still drive a
; PlatformIO upload and are the developer alternative.
;
; One consequence binds this file: the Arduino AVR core hard-codes
; `-std=gnu++11` and the IDE cannot override it, so anything court_mega links
; must be valid C++11 as well as C++17. See proto::verbSpecsAreInEnumOrder.
;
; FIRMWARE VERSION HISTORY — this is where it is kept.
;   3.1.0  BRIDGE ONLY — the Mega stays 3.0.0 (its last image) and is not
;          reflashed. The device key ring (key_next, 401 retried once with
;          the other key); the runtime network (server `net` all or nothing,
;          previous set kept, unproven base abandoned); the link supervisor and the 6 h
;          stall watchdog; LittleFS persistence of the last accepted answer
;          (warm/cold restore, provisional lights capped at the trust window)
;          and of every undelivered event (carried under its own boot id); caps
;          key:1 net:1; a lost Mega line earns a !PING (a !BOOT the link
;          garbled is found in a second); 64 member-code keys; exact integer
;          kinds; the D10 pay-for flow out of the image.
;   3.0.0  MEGA AND BRIDGE (both reflashed, Mega first — the Mega's last image;
;          docs/specs/device-serial-protocol.md chapter v3 and
;          device-api.md). MEGA: !BOOT (MCUSR) and !STATE before the LCD; tagged
;          relay frames answered !ACK with duplicate detection; !WANT (light or
;          lengthen, never open); the authorisation cap (CAP, !EVT,CAPOFF); a
;          256-byte uplink queue; !RW/!CMT staging with mask + CRC, cleared after
;          every commit; the absolute screen ceiling, dwell, after-lights-on and
;          chain rules, presses never re-arming a hold; the landing composed on
;          the Mega (SCAN YOUR QR + every court's minutes) in a runtime layout —
;          compact 16x2 on any doubt or expanded 20x4 — with a software marquee;
;          the self-healing glass (shadow + diff paint, repaint after any bus
;          error, re-init every REINIT s); bridge liveness (!LIVE, OUT OF
;          SERVICE); every hardware fact a !CFG key (RPOL with released relays as
;          INPUTS, LCDA with the 0x27/0x3F/... probe and its own PCF8574 driver,
;          SBAUD auto-detect, SSUF/SGAP gap-terminated lines, KEYS) reported in
;          !HW; !DIAG. BRIDGE: the paced, never-dropping,
;          tagged and acknowledged Mega sender (v2 to a 2.x Mega, nothing relay
;          before the Mega is heard); screens as !RW/!CMT for the acknowledged
;          layout; no identity overlays; !CFG set on every Mega boot and beat
;          (KEYS from button_map), !LIVE,5, !IDLE every 30 s and beat, !LAND; the
;          heartbeat v3 (hb:3, lcd:2; mega, diag, drift, relight; 1536-byte
;          request, 5120-byte answer) and the continuous snapshot reconcile
;          (!WANT on every beat, Mega boot and contradicting !STATE, never off,
;          member-release suppression, release `cause`); every 2xx a decision;
;          play_remaining_seconds; one 512-byte reply buffer. The panel size is
;          a runtime setting: the old "16x2"/"20x4" lines below were guesses.;   2.3.0  BRIDGE (with Mega 2.1.0 — both chips are reflashed). Landing,
;          greeting, minutes-left and EXTEND at the box. A recognised online
;          scan greets first — `HI <NAME>` / `BALANCE <n> MIN` from the
;          activate response's `greeting_name` / `balance_minutes`, tolerated
;          absent — then shows the outcome (court lit, or PICK A COURT / THEN A
;          TIME). An unscanned court press on a lit court reads `COURT A 45
;          MIN` / `SCAN TO EXTEND`, on a dark one SCAN YOUR CODE. After a scan,
;          a lit court (anyone's) offers EXTEND:PICK TIME; a black button POSTs
;          /api/v1/device/extend and sends `!EXT`. The pay-for offer and the
;          own-court-press-to-switch-off are gone from the panel.
;   2.1.0  MEGA. Relays are ACTIVE HIGH (RELAY_ACTIVE_LOW=0): the club fitted
;          normally-open solid-state relays and 2.0.0 lit them when it meant
;          off. The landing screen leads with SCAN YOUR CODE and row 1 carries
;          the lit courts' minutes left (the club's panel is a 16x2). Court keys
;          are forwarded as `!BTN` with the window shut (duration keys still
;          dropped and counted); the Mega paints SCAN CODE FIRST itself if the
;          bridge does not answer in 1.5 s. `!STATE` goes out after every
;          accepted `!EXT`.
;   2.2.9  BRIDGE ONLY — the Mega stays 2.0.0 and is not reflashed; wiring,
;          pins and the serial protocol are untouched. The remembered scan is
;          one rule (bridgelogic::ScanMemory): a scan is kept for the club's
;          own scan_memory_seconds (2.2.8 used the compile-time 30 s, D19-3);
;          a pay-for quote or a PRESS AGAIN holds it for its whole countdown
;          and never shortens it (2.2.8's quote cut it below the countdown
;          after a BUSY hold and the confirm press went nowhere, D19-1); and no
;          hold carries it past the server's own bound on scan_age_ms less
;          5 s — when a whole countdown no longer fits, the glass says SCAN
;          AGAIN instead of inviting a press the server would refuse as
;          not_recognised (D19-2, new screen ScanAgain).
;   2.2.8  BRIDGE ONLY — the Mega stays 2.0.0 and is not reflashed; wiring,
;          pins and the serial protocol are untouched. Every "how old is it?"
;          age — the roster's, the member-code step clock's, the wall clock's —
;          is observed on every pass and latches stale once past its bound:
;          2.2.7 read each as a 32-bit difference, so after 2^32 ms (49.7 days)
;          offline a seven-week-old roster, a step clock 143 165 steps behind
;          and a clock ~17 h wrong all read fresh again (review round 18,
;          D18-2). A pay-for QUOTE answered 429 or 5xx reads BUSY / PRESS
;          AGAIN (no connection: NO CONNECTION) and keeps the scan; 2.2.7 fell
;          through to CHOOSE TIME and offered walk-up time on a court somebody
;          holds (D18-3). Any walk-up or pay-for answer that decided nothing
;          re-arms the scan and the Mega's button window for the whole choice
;          window, so PRESS AGAIN works for as long as it is shown (D18-4).
;   2.2.7  BRIDGE ONLY — the Mega stays 2.0.0 and is not reflashed; wiring,
;          pins and the serial protocol are untouched. The event drain's pace
;          is observed on every pass, offline ones included: 2.2.6 skipped the
;          drain while the radio was down or the breaker open, so a backoff
;          window armed just before an outage longer than 2^31 ms read as
;          pending again and the drain stalled for up to 24.8 more days (review
;          round 17, D17-2). A walk-up or pay-for confirm answered 429 or 5xx
;          reads BUSY / PRESS AGAIN, keeping the scan and the nonce so the same
;          press retries the same purchase; 2.2.6 said SEE THE DESK (D17-4).
;   2.2.6  BRIDGE ONLY — the Mega stays 2.0.0 and is not reflashed; wiring,
;          pins and the serial protocol are untouched. The event drain backs
;          off: a post that leaves the head event where it was (401, 403, 404,
;          408, 429, 5xx, or a 200 acknowledging nothing) waits 15 s, doubling
;          to 5 min, and anything that moves the queue clears it. 2.2.5
;          re-posted it on every pass, so a disabled box spent the club's
;          whole device budget and every other box was answered 429 (review
;          round 16, D16-2). A 404 on `/events` — the console deleted the box
;          — keeps the event instead of dropping it (D16-3).
;   2.2.5  BRIDGE ONLY — the Mega stays 2.0.0 and is not reflashed; wiring,
;          pins and the serial protocol are untouched. The scanned token is
;          ESCAPED in the activate, walk-up and pay-for bodies (it was a bare
;          `%s`), and the shared JSON escaper writes every byte above 0x7E as
;          `\u00XX`, so every body the box sends is ASCII, valid JSON and
;          valid UTF-8 whatever the Mega passed through from the scanner. One
;          scan of a quote or a 0xE9 was a body the server answered 500; the
;          drain retried that event for ever and the breaker read it as an
;          outage (review round 15, D15-1).
;   2.2.4  BRIDGE ONLY — the Mega stays 2.0.0 and is not reflashed; wiring,
;          pins and the serial protocol are untouched. A walk-up refusal
;          forgets the scan only for `code_used` and `not_recognised`; 2.2.3
;          forgot it for every refusal made before the server resolved the
;          token, so `TOO LONG / TRY LESS TIME` disarmed the buttons and the
;          shorter press it asked for was dropped (review round 9, D9-1). A
;          pay-for refused `code_used` reads `CODE USED / WAIT 30 SECONDS`,
;          as at every other button, not `CODE NOT KNOWN` (D9-2).
;   2.2.3  BRIDGE ONLY — the Mega stays 2.0.0 and is not reflashed; wiring,
;          pins and the serial protocol are untouched. A `code_used` from the
;          server — and a code nobody owns, or a refusal this build cannot
;          name — arms no buttons and the scan is forgotten, so a photo of the
;          code that just lit a court cannot buy a walk-up or a pay-for on that
;          member's minutes; a pay-for or walk-up refusal of the code forgets
;          it too (review round 8, D8-1). The activation waits on
;          `ONE MOMENT / Checking code`, never the walk-up's `Buying your time`
;          (D8-2). A court is remembered as a member's online grant only when
;          its `!ON` left, and forgotten when the retry gives up (D8-3).
;   2.2.2  BRIDGE ONLY — the Mega stays 2.0.0 and is not reflashed; wiring,
;          pins and the serial protocol are untouched. 2.2.1's rule reaches a
;          court the box lit ONLINE for the member — a walk-up, a pay-for, an
;          activation the roster does not name yet: the same code rescanned
;          there inside its thirty seconds reads `COURT C IS ON` with their OFF
;          bound, not `CODE USED` (review round 7, D7-1). Nothing on the wire
;          changes.
;   2.2.1  BRIDGE ONLY — the Mega stays 2.0.0 and is not reflashed; wiring,
;          pins and the serial protocol are untouched. The member who lit a
;          court and scans the SAME code again inside its thirty seconds reads
;          `COURT B IS ON` with their OFF bound to it, not `CODE USED` with the
;          buttons disarmed; the used code still buys nothing (review round 6,
;          D6-3). Nothing on the wire changes.
;   2.2.0  BRIDGE ONLY — the Mega stays 2.0.0 and is not reflashed; wiring,
;          pins and the serial protocol are untouched. Minutes, not credits
;          (P13, docs/specs/minutes-and-packages.md §8): the glass says
;          `PAY 45 MIN?` / `45 MIN PAID` / `TOO FEW MINUTES`, and an
;          `amount_label` is accepted only as 1-4 digits of whole minutes.
;          A 2.1.0 bridge keeps working against the new server (an integer
;          label passes its check) but still prints `cr`.
;   2.1.0  BRIDGE ONLY — the Mega stays 2.0.0 and is not reflashed. The single
;          rotating member code (docs/specs/member-code.md): a v1 code is
;          verified offline against per-day keys from the heartbeat, rosters
;          name a booking's players, `codes:m1` on every heartbeat, and D10
;          pay-for at the box. Additive on the wire; every legacy body is
;          byte-for-byte unchanged.
;   2.0.0  contract break. Request signing, the discovery beacon, claim codes,
;          provisioning, the device clock and the flash credential store are all
;          gone; authentication is one static per-tenant key in an
;          `Authorization: Bearer` header and the box's MAC in the request body.
;          WIFI_SSID, WIFI_PASSWORD, API_BASE_URL and DEVICE_API_KEY are all
;          compiled in and all mandatory.
;   1.2.0  removed OTA, firmware signing and the runtime WiFi credential store.
;   1.1.0  the fix programme (bridgelogic, activation, H1 disarm symmetry).
;
; Everything in lib/ — here and in ../shared/lib — except arduino_hal/ and the
; shared posix_hal/ is free of Arduino headers and compiles for the host, which
; is what makes `pio test -e native` able to prove the logic with no board
; attached. posix_hal moved to ../shared/lib when the door gate grew a simulator
; of its own; `#include "posix_hal/…"` is unchanged, because an include does not
; say which lib root a module came from.
;
; `make test-iot` runs BOTH this project's suite and ../shared's; running only
; one of them proves half the firmware.
;
;   pio test -e native          unit + property + corpus tests (the primary gate)
;   pio test -e native_asan     the same suite under ASAN + UBSAN
;   pio run  -e court_mega      compile the ATmega firmware
;   pio run  -e court_bridge    compile the ESP8266 firmware
;   pio run  -e simulator       build the native device simulator
;
; Platform versions are pinned deliberately. An unpinned `platform = espressif32`
; is how a working build becomes a broken build six months later with no commit
; to blame — which is exactly what the deleted lights-controller sketch had.

[platformio]
default_envs = native
src_dir = src
lib_dir = lib
test_dir = test

; ---------------------------------------------------------------------------
; Applies to EVERY environment below, board builds and host tests alike.
;
; The device-agnostic libraries (timebase, hal, hal_fakes, devcrypto, fwversion,
; devapi, eventq, roster, devlink) live one directory up, in ../shared/lib, and
; are compiled from source into whichever target needs them — PlatformIO's LDF
; treats an extra dir exactly like lib/. There is no package, no version pin and
; no copy: one source of truth, compiled twice.
;
; A sibling firmware project gets at them with the same one line.
; ---------------------------------------------------------------------------
[env]
lib_extra_dirs = ../shared/lib

; ---------------------------------------------------------------------------
; Shared settings.
; ---------------------------------------------------------------------------
[common]
build_flags =
    -std=gnu++17
    ; See the version history at the top of this file. The heartbeat reports
    ; this as `firmware_version`, which is all it is for: there is no update
    ; mechanism left for it to feed.
    -DFW_VERSION_MAJOR=2
    -DFW_VERSION_MINOR=0
    -DFW_VERSION_PATCH=0

; Host builds get -Wall -Wextra, but NOT -Werror or -Wconversion here.
;
; Those flags apply to every translation unit PlatformIO compiles, including the
; vendored Unity test framework, which does not survive them. Suppressing the
; specific warnings globally would defeat the gate for our code too.
;
; So strictness is enforced separately and more thoroughly, by tools/strict_compile.sh,
; which compiles only our own sources with the full pedantic set as errors. That
; gate is real, it cannot be diluted by a third-party dependency, and it runs in
; CI and in `make lint-iot`.
;
; The one include root beyond PlatformIO's own: ../shared/test, which holds the
; corpus reader every project's suite uses. PlatformIO puts a project's OWN
; test_dir on the include path and nothing else, so without this line
; `support/CorpusJson.h` is reachable from `shared` alone. The expression names
; the same directory from every project, which is what keeps this block
; byte-identical across all of them.
[strict_host]
build_flags =
    ${common.build_flags}
    -Wall -Wextra
    -DHOST_BUILD=1
    -I$PROJECT_DIR/../shared/test

; ---------------------------------------------------------------------------
; Host unit tests — the primary gate.
; ---------------------------------------------------------------------------
; ---------------------------------------------------------------------------
; The screen-hold clamp, for every environment that composes or paints text.
;
; There is NO panel geometry here any more (Mega 3.0.0, FWM-17): which panel is
; fitted — a 1602 or a 2004 — is unrecorded, so the layout is the runtime
; `!CFG,LAYOUT` setting (`lcd_layout`, compact 16x2 on any doubt) and the
; driver addresses the 20x4 DDRAM grid either controller has. The flags that
; used to say "20x4" described a panel nobody had looked at.
;
; It is NOT in [strict_host]: that block is kept byte-identical across every
; firmware project in src/iot, and a door gate has no LCD.
[lcd]
build_flags =
    ; The clamp that cannot be configured away: no screen the bridge paints may
    ; outlive two minutes. Defined here as well as on the Mega so Protocol.h's
    ; drift assert fires in every build that could disagree about it.
    -DLCD_HOLD_MAX_MS=120000UL

; The host suite and the simulator report the court box's own version
; (3.0.0), like the two chips: [common]'s MAJOR is unflagged and re-set by a
; different token. A host build that called itself 2.0.0 made the bridge's
; dialect selection speak v2 to the real 3.0.0 Mega in the soak.
[court_version]
build_flags = -DFW_VERSION_MAJOR=3

[env:native]
platform = native
test_framework = unity
build_flags = ${strict_host.build_flags} ${lcd.build_flags} ${court_version.build_flags} -O1 -g
build_unflags = -DFW_VERSION_MAJOR=2
build_src_filter = -<*>
test_build_src = no

; ASAN/UBSAN flags go in build_flags: the native platform passes them to both the
; compile and the link step, and there is no separate link_flags key.
[env:native_asan]
extends = env:native
build_flags = ${strict_host.build_flags} ${lcd.build_flags} ${court_version.build_flags} -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer

[env:native_cov]
extends = env:native
build_flags = ${strict_host.build_flags} ${lcd.build_flags} ${court_version.build_flags} -O0 -g --coverage

; ---------------------------------------------------------------------------
; Court box — ATmega2560. Thin I/O plus an INDEPENDENT relay safety timer that
; releases the lights even if the ESP, the network and the backend are all gone.
; 8 KB SRAM total, so no heap, no String, no std::string in anything it links.
;
; Wiring (fixed, cannot change):
;   relays  pins 2,3,4,5   courts A-D. Released = INPUT (high-Z), off for either
;           module; the drive level is the runtime RPOL (HW-1), boot default below
;   buttons pins 22,24,26,28 and 30,32,34,36; which are court keys is the
;           runtime KEYS mask from button_map (HW-7)
;   LCD     I2C on SDA 20 / SCL 21; address probed or LCDA (HW-2); layout the
;           runtime LAYOUT, compact 16x2 on any doubt
;   scanner Serial2, RX 17 / TX 16; baud auto-detected or SBAUD, line end SSUF /
;           SGAP (HW-5); the Mega never writes to the scanner
;   bridge  Serial3, TX 14 / RX 15 @ 9600
; ---------------------------------------------------------------------------
[env:court_mega]
platform = atmelavr@5.0.0
board = megaatmega2560
framework = arduino
board_build.f_cpu = 16000000L
; No monitor_speed, deliberately. The Mega never opens Serial0: its two UARTs
; are the scanner on Serial2 and the bridge on Serial3, both fixed at 9600 by
; Pins.h, and nothing in court_mega/ or lib/courtlogic calls Serial.begin(). A
; monitor speed here described a stream that does not exist, and a technician
; running `pio device monitor` on it read the resulting silence as a dead board.
upload_speed = 115200
build_flags =
    ${common.build_flags}
    -Wall -Wextra
    -DTARGET_COURT_MEGA=1
    ${lcd.build_flags}
    ; 0 = ACTIVE HIGH: the club's normally-open solid-state relays close on a
    ; HIGH input. 1 was the SONGLE coil board, and drove the lights off when
    ; the box meant on (Mega 2.1.0).
    -DRELAY_ACTIVE_LOW=0
    -DSCANNER_BAUD=9600 -DBRIDGE_BAUD=9600
    -DRELAY_HARD_CAP_MS=5400000UL
    ; Mega 3.0.0, the last Mega image. [common]'s MAJOR is unflagged below and
    ; re-set here by a DIFFERENT token, which survives (see court_bridge);
    ; MINOR and PATCH come from [common] (0).
    -DFW_VERSION_MAJOR=3
; The Arduino AVR builder APPENDS `-std=gnu++11` to CXXFLAGS after build_flags
; have been processed, so [common]'s `-std=gnu++17` lost every time and the
; whole of lib/ — which is full of C++17 `inline constexpr` variables — could
; never compile for this board. Unflagging it is what lets ours win. This was
; invisible for as long as `pio run` was broken by the library coordinate above.
build_unflags = -std=gnu++11 -DFW_VERSION_MAJOR=2
build_src_filter = +<court_mega/> +<common/>
; No LCD library (Mega 3.0.0): arduino_hal::LcdDisplay drives the PCF8574
; backpack itself, because the address is probed at run time (HW-2) and the
; self-healing glass re-runs the 4-bit init — a library that fixes the address
; at construction and hides its nibble writer can do neither. Wire is the core's.
test_ignore = *

; ---------------------------------------------------------------------------
; Court box — BENCH ONLY. Identical to court_mega except that it stalls a pass
; of loop() sixty seconds after boot, so the go-live watchdog check has
; something to observe.
;
; It exists because the Wire timeout added for the I2C wedge made the previous
; bench check unfirable: shorting SDA now costs 25 ms per write and the holdoff
; skips the next twenty, so loop() returns and the watchdog never fires — the
; correct behaviour, and a test that can no longer fail (review 3, finding 11).
; The SDA short proves the timeout and the holdoff; THIS build proves the
; watchdog and, with it, whether this board's stk500v2 bootloader survives a WDT
; reset — the Mega's one hard-safety property, and the only one no host test can
; reach.
;
; NEVER upload this to a club box. Nothing in CI builds it and it is not in
; default_envs; the flag exists in this one environment and nowhere else.
[env:court_mega_bench]
extends = env:court_mega
build_flags =
    ${env:court_mega.build_flags}
    -DWDT_BENCH_STALL=1

; ---------------------------------------------------------------------------
; Court brain — the onboard ESP8266. Protocol, state, roster cache and the event
; queue live here. 4M2M gives 1 MB max sketch plus 2 MB LittleFS. The filesystem
; holds the event queue's sequence high-water mark, which the API's permanent
; (tenant, device, seq) dedupe index makes load-bearing, and the bridge's records
; (the last accepted answer, undelivered events, the keys and the network set). The WiFi credential,
; base URL and device key are compiled in from src/common/secrets.h as the
; first-boot defaults; court_bridge refuses to build without all four.
; ---------------------------------------------------------------------------
[env:court_bridge]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
; 9600, not 115200: the ESP's UART0 IS the Mega link, and DIP 5,6 route that
; same UART to USB for monitoring. A monitor opened at 115200 shows framing
; garbage that reads as a corrupted board during exactly the site visit where
; that misdiagnosis costs the most.
monitor_speed = 9600
build_flags =
    ${common.build_flags}
    -Wall -Wextra
    -DTARGET_COURT_BRIDGE=1
    ; Bridge 3.1.0: MAJOR and MINOR unflagged below and re-set by DIFFERENT
    ; tokens (an identical token would be stripped with [common]'s); PATCH
    ; from [common] (0).
    -DFW_VERSION_MAJOR=3
    -DFW_VERSION_MINOR=1
    ; PATCH comes from [common] (0): unflagging and re-setting the SAME token
    ; would drop both.
    ; The bridge WRITES the lines the Mega paints, so it takes the same
    ; geometry. When these two disagreed, the bridge composed for sixteen
    ; columns and the other four were unreachable whatever the Mega was built
    ; for.
    ${lcd.build_flags}
    -DHEARTBEAT_INTERVAL_MS=30000UL
    -DAUTH_TTL_MS=30000UL
    -DROSTER_MAX_AGE_MS=21600000UL
    -DEVENTQ_SLOTS=64
    ; The bridge display-clamps grants to the same 90 minutes the Mega enforces.
    ; Defining the flag here activates Protocol.h's drift assert in THIS build
    ; too, so the two halves cannot disagree about the cap without a compile error.
    -DRELAY_HARD_CAP_MS=5400000UL
; BOTH CHIPS ARE 3.0.0 (see the version history at the top): the Mega is
; reflashed one last time, first, then this bridge. [common] stays
; byte-identical across the projects; this environment unflags [common]'s MAJOR
; by [common]'s own token and sets its own, a DIFFERENT token, which survives
; (see door-gate/platformio.ini for what unflagging and re-setting the SAME
; token does). Devices shows 3.0.0 once the ESP8266 is flashed, and the Mega's
; 3.0.0 as `mega_version` once the bridge has heard its !BOOT — that is how the
; person who flashed them knows both landed.
build_unflags = -DFW_VERSION_MAJOR=2 -DFW_VERSION_MINOR=0
build_src_filter = +<court_bridge/> +<common/>
; No lib_deps: the bridge reads JSON with devapi::json (ESPR-7 — the
; ArduinoJson dependency was linked by nothing).
test_ignore = *

; ---------------------------------------------------------------------------
; Native device simulator — the SAME lib/ logic behind a POSIX HAL and a real
; TCP listener, so the .NET integration tests run against a real implementation
; of the device protocol instead of a hand-written stub that only ever agrees
; with itself.
; ---------------------------------------------------------------------------
[env:simulator]
platform = native
; RELAY_ACTIVE_LOW is the Mega's own value: the simulator is the Mega, so its
; `[relay] ... (pin level X)` lines name the level the fitted solid-state
