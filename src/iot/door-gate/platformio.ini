; Crusaders Mainframe — the DOOR GATE firmware (src/iot/door-gate).
;
; One of the firmware projects under src/iot. The device-agnostic libraries it
; builds on are NOT in this directory: they live in ../shared/lib and arrive
; through `lib_extra_dirs` below. Anything in this project's own lib/ is true of
; THIS hardware — the lock relay's two polarity questions, the scanner line
; assembly, the release timer, the LED patterns — and belongs nowhere else.
;
; The door gate is ONE ESP32 per door: a QR scanner on Serial2, one relay
; driving the door lock, one LED. No LCD, no buttons, no second microcontroller.
; Carl's wiring is fixed (see README.md) and every pin is a build flag below
; with his value as the default, because the pins are the part nobody has
; confirmed for the second and third door.
;
; ONE FIRMWARE FOR EVERY DOOR. Nothing per-gate is compiled in: a door is named
; in the admin console (`gate_key`), the API keys that name to this board's MAC,
; and the board never needs to know it — it does not parse `gate_key` and has no
; field to keep one in. Two doors run byte-identical images.
;
; PULL-ONLY, like the court box. There is no inbound HTTP server, no static IP
; and no `WiFi.config()` anywhere in this project — Carl's sketch had all three,
; and its `/open` endpoint unlocked the door for anyone on the club WiFi.
;
; FIRMWARE VERSION HISTORY — this is where it is kept.
;   1.0.0  first release. Pull-only, bearer-authenticated, online-first with a
;          roster fallback, and a lock that is asserted LOCKED before its pin is
;          ever an output.
;   1.1.0  single rotating member code (docs/specs/member-code.md); offline
;          replay refusal.
;   1.1.1  every "may I yet?" window is spent on the pass it ends, whatever the
;          link is doing — the event drain's backoff, the heartbeat floor, the
;          boot hold-back, the `/gate` call floor, the unreadable-line window
;          and the lock's relock dwell. Left armed, a window older than 2^31 ms
;          read as pending again: after a 25-day outage the board stayed silent,
;          and after a 25-day quiet spell the first member back was refused
;          `relocking` or `too_fast` for up to 24.8 more days (review round 17,
;          D17-2). No wiring, pin or wire-format change.
;   1.1.2  every "how old is it?" age is observed on every pass, so none reads
;          young again after the 2^32 ms (49.7-day) wrap: the roster and the
;          member-code step clock latch stale past their bound (a 49.7-day
;          outage opened the door, offline, for a seven-week-old booking), a
;          debounce slot past its window is forgotten (the member's scan one
;          wrap later was dropped) and an ended lamp cue is cleared (it replayed
;          at nobody). Review round 18, D18-2; the roster and step clock are the
;          shared libraries the court box uses too. No wiring, pin or
;          wire-format change.
;   2.0.0  device contract v3 (docs/specs/door-gate.md §14). No over-the-air
;          update, by decision: a new image is still a cable flash. Device
;          keys rotate over the heartbeat (k0 is the compiled key); WiFi
;          and the server URL change from the server or the BOOT-button setup
;          portal, with a link supervisor; the roster, keys, step clock, gate
;          settings, replay ring and undelivered events survive a reset (RTC
;          memory warm, NVS cold); the v3 readers (every 2xx, exact kinds, the
;          gate object's scalars only, element grammars by their first fields);
;          telemetry and drift in the heartbeat; the scanner's 150 ms idle gap;
;          new lamp states; the stall watchdog. Heartbeat answer read into 8192,
;          the scan decision into 256. secrets.h gains SETUP_AP_PASSWORD. No
;          wiring or pin change.
;
; Everything in lib/ — here and in ../shared/lib — except esp32_hal/ is free of
; Arduino headers and compiles for the host, which is what makes
; `pio test -e native` able to prove every decision with no board attached.
;
; `make test-iot` runs this project's suite, ../shared's AND ../court-box's;
; running one of the three proves a third of the firmware.
;
;   pio test -e native          unit + property + corpus tests (the primary gate)
;   pio test -e native_asan     the same suite under ASAN + UBSAN
;   pio run  -e door_gate       compile the ESP32 firmware
;   pio run  -e simulator       build the native door simulator
;
; The platform version is pinned deliberately. An unpinned `platform =
; espressif32` is how a working build becomes a broken build six months later
; with no commit to blame — which is exactly what the deleted lights-controller
; sketch had.

[platformio]
default_envs = native
src_dir = src
lib_dir = lib
test_dir = test

; ---------------------------------------------------------------------------
; Applies to EVERY environment below, board builds and host tests alike.
;
; The device-agnostic libraries (timebase, hal, hal_fakes, devcrypto, fwversion,
; devapi, eventq, roster, devlink) live one directory up, in ../shared/lib, and
; are compiled from source into whichever target needs them — PlatformIO's LDF
; treats an extra dir exactly like lib/. There is no package, no version pin and
; no copy: one source of truth, compiled twice.
; ---------------------------------------------------------------------------
[env]
lib_extra_dirs = ../shared/lib

; ---------------------------------------------------------------------------
; Shared settings. Kept byte-identical to ../court-box/platformio.ini's and
; ../shared/platformio.ini's [common] and [strict_host] on purpose: the shared
; libraries are compiled by ALL THREE projects and a flag that differs between
; them is a library that behaves differently depending on which suite ran it.
;
; That includes the FW_VERSION_* triple, which is why this gate's own version is
; NOT set here. [env:door_gate] does not inherit this block at all — it spells
; out `-std=gnu++17` and sets its own (2.0.0) — so the divergence sits in the
; board environment, where a firmware version belongs, and the host suites of
; all three projects still compile the shared libraries from identical flags.
; It used to inherit-and-unflag, which silently deleted two of the three; the
; note in [env:door_gate] carries that in full. See the version history above.
; ---------------------------------------------------------------------------
[common]
build_flags =
    -std=gnu++17
    ; The heartbeat reports this as `firmware_version`. The version history
    ; itself is kept with the firmware that ships it — see the top of this file.
    -DFW_VERSION_MAJOR=2
    -DFW_VERSION_MINOR=0
    -DFW_VERSION_PATCH=0

; Host builds get -Wall -Wextra, but NOT -Werror or -Wconversion here.
;
; Those flags apply to every translation unit PlatformIO compiles, including the
; vendored Unity test framework, which does not survive them. Strictness is
; enforced separately and more thoroughly by ../court-box/tools/strict_compile.sh,
; which compiles only our own sources — in EVERY project under src/iot — with the
; full pedantic set as errors.
;
; The one include root beyond PlatformIO's own: ../shared/test, which holds the
; corpus reader every project's suite uses. PlatformIO puts a project's OWN
; test_dir on the include path and nothing else, so without this line
; `support/CorpusJson.h` is reachable from `shared` alone. The expression names
; the same directory from every project, which is what keeps this block
; byte-identical across all of them.
[strict_host]
build_flags =
    ${common.build_flags}
    -Wall -Wextra
    -DHOST_BUILD=1
    -I$PROJECT_DIR/../shared/test

; ---------------------------------------------------------------------------
; Host unit tests — the primary gate.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = ${strict_host.build_flags} -O1 -g
build_src_filter = -<*>
test_build_src = no

; ASAN/UBSAN flags go in build_flags: the native platform passes them to both the
; compile and the link step, and there is no separate link_flags key.
[env:native_asan]
extends = env:native
build_flags = ${strict_host.build_flags} -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer

[env:native_cov]
extends = env:native
build_flags = ${strict_host.build_flags} -O0 -g --coverage

; ---------------------------------------------------------------------------
; Door gate — ESP32. One board per door, flashed over USB.
;
; Wiring (Carl's, immutable — the flags below are his values as defaults):
;   scanner Serial2, RX 4 / TX 17 @ 9600 8N1 (the scanner only talks; TX 17 is
;           wired and unused)
;   relay   GPIO 26  — drives the door lock through the relay module
;   LED     GPIO 27
;
; The two polarity flags are INDEPENDENT and both matter:
;   GATE_RELAY_ACTIVE_HIGH    what level energises the relay COIL (the module)
;   GATE_UNLOCK_ENERGISES_RELAY  whether an energised coil RELEASES the lock
;                                (the lock's own wiring, NC vs NO contact)
; README.md carries the truth table for all four combinations and says which
; one gives "the door is released when there is no power".
;
; GATE_UNLOCK_HARD_CAP_MS is a safety bound, not a default: it is the longest
; ONE release window may last, whatever the server answers and however often
; somebody scans.
;
; ON ITS OWN THAT BOUNDS THE WINDOW AND NOT THE DOOR (round G4, A1). The cap
; closed a window and the very next accepted scan opened a fresh one, in the
; SAME pass — measured relay OFF at t=31034 ms and ON at t=31034 ms, dark for
; 0 ms, then +42 ms, then +45 ms, for ever. A relay de-energised for zero
; milliseconds was never de-energised. GATE_RELOCK_DWELL_MS and
; GATE_MIN_RELOCK_MS are what make the cap a bound on the door: after a close,
; the lock is genuinely locked for a stated time and no grant may energise the
; relay inside it. Timing only — no wiring flag changes.
; ---------------------------------------------------------------------------
[env:door_gate]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
; 115200: this board's UART0 is the USB console and nothing else — unlike the
; court bridge, whose UART0 IS its link to the Mega. The scanner is on Serial2.
monitor_speed = 115200
upload_speed = 921600
; THIS ENVIRONMENT DOES NOT EXTEND ${common.build_flags}, AND THAT IS THE FIX.
;
; [common] pins the COURT BOX's firmware version, because those blocks are kept
; byte-identical across the three projects. This gate ships its own, and it used
; to get there by inheriting [common] and unflagging the three defines — which
; does not work, and was producing the right answer by luck.
;
; `build_unflags` removes EVERY token that matches, including the environment's
; own. `[env:door_gate]` unflagged `-DFW_VERSION_MINOR=0` and then set
; `-DFW_VERSION_MINOR=0` — the same token — so both were removed and neither
; MINOR nor PATCH reached the compiler on either build route. The image reported
; 1.0.0 only because `fwversion/Version.h`'s `#ifndef` fallback is also 0. The
; major number survived because its unflag named a different value (2, not 1).
;
; So the version is set here DIRECTLY and nothing about it is unflagged. [common]
; is still byte-identical across the three projects — the host suites still use
; it through [strict_host] — this board environment simply does not inherit it,
; and `-std=gnu++17` is spelled out instead. main.cpp `#error`s unless all three
; parts are defined AND are the gate's, on both build routes, so a version that
; silently falls back to a header default is a build that does not produce an
; image.
build_unflags =
    ; The ESP32 Arduino builder APPENDS `-std=gnu++11` to CXXFLAGS after
    ; build_flags have been processed, exactly as the AVR one does for the court
    ; box — so [common]'s `-std=gnu++17` loses every time and lib/, which is full
    ; of C++17 `inline constexpr` variables, cannot compile for this board at
    ; all. Unflagging it is what lets ours win.
    ;
    ; THIS UNFLAG DOES NOT REACH THE ARDUINO IDE, AND THE IDE IS THE DEPLOYMENT
    ; ROUTE. `-std=gnu++11` is hard-coded in the esp32 core's platform.txt for
    ; every variant and a sketch cannot override it, so the generated
    ; arduino/door_gate/ sketch compiles this project's lib/ AND ../shared/lib
    ; at C++11 — exactly the constraint the court box carries from its AVR half.
    ; `inline constexpr` VARIABLES survive (GCC takes them in C++11 as an
    ; extension); a multi-statement `constexpr` FUNCTION does not, and one in
    ; LockDriver.h was green under `pio run` and red under arduino-cli. The
    ; arduino-cli compile in ci.yml's iot-build job is the gate for this;
    ; nothing on the PlatformIO side can see it.
    -std=gnu++11
build_flags =
    ; [common]'s standard, spelled out rather than inherited — see the
    ; build_unflags note above. If [common] ever gains a flag that is not a
    ; version define, it has to be added here too.
    -std=gnu++17
    -Wall -Wextra
    ; 2.0.0: device contract v3 (see the history above).
    -DFW_VERSION_MAJOR=2
    -DFW_VERSION_MINOR=0
    -DFW_VERSION_PATCH=0
    -DTARGET_DOOR_GATE=1
    -DGATE_SCANNER_RX_PIN=4
    -DGATE_SCANNER_TX_PIN=17
    -DGATE_SCANNER_BAUD=9600UL
    -DGATE_RELAY_PIN=26
    -DGATE_RELAY_ACTIVE_HIGH=1
    -DGATE_UNLOCK_ENERGISES_RELAY=1
    -DGATE_LED_PIN=27
    -DGATE_LED_ACTIVE_HIGH=1
    ; FIFTEEN, AND IT WAS CARL'S THREE. `delay(3000)` is a number about a lock
    ; throwing, not about a person noticing a lamp, moving a bag and pulling a
    ; door. It is only the value a board runs on until `gate.unlock_seconds`
    ; arrives on a heartbeat, so a club that wants three back sets three in the
    ; console and has it without a reflash — see GateConfig.h.
    -DGATE_UNLOCK_DEFAULT_MS=15000UL
    -DGATE_UNLOCK_HARD_CAP_MS=30000UL
    ; The dark time a cap-forced close guarantees, and the floor under every
    ; close. See the note above and GateConfig.h for why there are two — and why
    ; this one did NOT move with the default above: it is a door-closing time,
    ; not a release time, and fifteen seconds of it would refuse a queue of
    ; members for a quarter of a minute over something one person did.
    -DGATE_RELOCK_DWELL_MS=3000UL
    -DGATE_MIN_RELOCK_MS=400UL
    -DGATE_MAX_TOKEN_LEN=20
    ; Fifteen, not twelve: round G3 gave the response BODY its own budget, so a
    ; worst-case call is connect + headers + body = 12 s and a 12 s watchdog
    ; would be the reset loop the assert in GateConfig.h exists to prevent.
    -DGATE_WATCHDOG_SECONDS=15
    -DHEARTBEAT_INTERVAL_MS=30000UL
    -DROSTER_MAX_AGE_MS=21600000UL
    -DEVENTQ_SLOTS=64
    ; THE FAULT CHANNEL'S TWO SETTINGS, as compile-time fallbacks only.
    ;
    ; Both are overridden by `gate.device_fault_reporting` and
    ; `gate.device_fault_max_per_hour` on the heartbeat once the API emits them;
    ; until it does, an absent key leaves these in place, which is the same rule
    ; `gate.unlock_seconds` has always followed. There is deliberately NO corpus
    ; response vector for them yet — see FaultLog.h and README.md.
    ;
    ; Twenty an hour per code is one event every three minutes per code. A fault
    ; is COUNTED rather than queued, so 400 errors a minute cost one event every
    ; three minutes carrying 1200, not 400 events a minute carrying 1.
    -DFAULT_REPORT=1
    -DFAULT_MAX_PER_HOUR=20
build_src_filter = +<gate/> +<common/>
; THE PARTITION TABLE, pinned rather than inherited: the core's own default,
; which is also what the Arduino IDE flashes for an ESP32 Dev Module, so both
; build routes put NVS — the keys, the network and the cold records — at the
; same address and a reflash by either route leaves it where it was. Its app
; slot is 1.25 MB; the image is about 0.83 MB.
board_build.partitions = default.csv
; No lib_deps, deliberately. The one candidate is ArduinoJson, and the court
; bridge's export proves the point: it is declared there, vendored into the
; sketch, and included by nothing — devapi's heapless scanner reads the three
; fields these responses carry, and a heap that allocates a document four times
; a minute is a heap that fragments over a season in a cupboard.
test_ignore = *

; ---------------------------------------------------------------------------
; Native door simulator — the SAME lib/ logic behind a POSIX HAL and a REAL
; socket, so `test/e2e-device/door_evening.py` can put the actual firmware in
; the end-to-end chain instead of a Python script playing the board.
;
; The court box has had one of these for as long as it has had a protocol, and
; its header says why: a stub only ever agrees with itself, because both ends
; are written from one reading of the spec, so a misreading passes. The door's
; harness had exactly that shape, and the two defect classes it cannot see are
; the two this project has already paid for — round G1's four defects in a
; `loop()` no host test could see, and round G3's chunked framing that no test
; in the tree read a real socket to find.
;
; IT REPORTS THE SAME FIRMWARE VERSION AS THE BOARD (2.0.0), and does not
; inherit [strict_host] to get there: [strict_host] carries [common]'s court-box
; version, and `build_unflags` removes every token that MATCHES — so with the
; gate at 2.0.0 and [common] at 2.0.0, unflagging and re-setting would delete
; both, exactly the bug the board environment's comment carries in full. The
; host flags are spelled out instead, as [env:door_gate] spells out its own.
;
; NO WIRING FLAGS AND NO SECRETS. Every pin, polarity and timing comes from
; `gatelogic/GateConfig.h`'s defaults, which ARE Carl's values and are what the
; host suite already sees; the API base URL, the device key and the MAC arrive
; at RUN time from flags or the environment, because a credential compiled into
; a simulator is a credential in a build directory and, one `make
; arduino-export` later, in a sketch folder.
;
; `build_src_filter` does NOT include +<common/>: that directory is where the
; board's gitignored secrets.h lives, and this build must not want it.
; ---------------------------------------------------------------------------
[env:simulator]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra -DHOST_BUILD=1 -I$PROJECT_DIR/../shared/test -O1 -g -DFW_VERSION_MAJOR=2 -DFW_VERSION_MINOR=0 -DFW_VERSION_PATCH=0 -DSIMULATOR_BUILD=1
build_src_filter = +<simulator/>
test_ignore = *
