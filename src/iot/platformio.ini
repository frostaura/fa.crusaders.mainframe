; Crusaders Mainframe — IoT firmware for the court-control hardware.
;
; The court box is a WeMos Mega 2560 + onboard ESP8266. The Mega is a thin,
; near-static I/O layer and every piece of volatile logic lives on the ESP8266.
; Both halves are flashed over USB, by DIP switch — there is no over-the-air
; path and there is deliberately no longer any code for one: one club, one box,
; and the founder is the technician. src/iot/README.md's Flashing section is the
; whole procedure, and `make flash-mega` / `make flash-bridge` drive it.
;
; Everything in lib/ except arduino_hal/ and posix_hal/ is free of Arduino
; headers and compiles for the host, which is what makes `pio test -e native`
; able to prove the logic with no board attached.
;
;   pio test -e native          unit + property + corpus tests (the primary gate)
;   pio test -e native_asan     the same suite under ASAN + UBSAN
;   pio run  -e court_mega      compile the ATmega firmware
;   pio run  -e court_bridge    compile the ESP8266 firmware
;   pio run  -e simulator       build the native device simulator
;
; Platform versions are pinned deliberately. An unpinned `platform = espressif32`
; is how a working build becomes a broken build six months later with no commit
; to blame — which is exactly what the deleted lights-controller sketch had.

[platformio]
default_envs = native
src_dir = src
lib_dir = lib
test_dir = test

; ---------------------------------------------------------------------------
; Shared settings.
; ---------------------------------------------------------------------------
[common]
build_flags =
    -std=gnu++17
    -DFW_VERSION_MAJOR=1
    ; 1.2.0 removes OTA, firmware signing and the runtime WiFi credential store:
    ; USB flashing only, credentials compiled in from secrets.h. 1.1.0 was the
    ; fix programme (bridgelogic, activation, H1 disarm symmetry). The heartbeat
    ; still reports this as `running_version`, which is all it is now for.
    -DFW_VERSION_MINOR=2
    -DFW_VERSION_PATCH=0

; Host builds get -Wall -Wextra, but NOT -Werror or -Wconversion here.
;
; Those flags apply to every translation unit PlatformIO compiles, including the
; vendored Unity test framework, which does not survive them. Suppressing the
; specific warnings globally would defeat the gate for our code too.
;
; So strictness is enforced separately and more thoroughly, by tools/strict_compile.sh,
; which compiles only our own sources with the full pedantic set as errors. That
; gate is real, it cannot be diluted by a third-party dependency, and it runs in
; CI and in `make lint-iot`.
[strict_host]
build_flags =
    ${common.build_flags}
    -Wall -Wextra
    -DHOST_BUILD=1

; ---------------------------------------------------------------------------
; Host unit tests — the primary gate.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = ${strict_host.build_flags} -O1 -g
build_src_filter = -<*>
test_build_src = no

; ASAN/UBSAN flags go in build_flags: the native platform passes them to both the
; compile and the link step, and there is no separate link_flags key.
[env:native_asan]
extends = env:native
build_flags = ${strict_host.build_flags} -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer

[env:native_cov]
extends = env:native
build_flags = ${strict_host.build_flags} -O0 -g --coverage

; ---------------------------------------------------------------------------
; Court box — ATmega2560. Thin I/O plus an INDEPENDENT relay safety timer that
; releases the lights even if the ESP, the network and the backend are all gone.
; 8 KB SRAM total, so no heap, no String, no std::string in anything it links.
;
; Wiring (fixed, cannot change):
;   relays  pins 2,3,4,5   active LOW, courts A-D
;   buttons pins 22,24,26,28 (courts A-D) and 30,32,34,36 (15/30/45/60m)
;   LCD     I2C 0x27 on SDA 20 / SCL 21 — physical panel is 20x4, driven as 16x2
;   scanner Serial2, RX 17 / TX 16 @ 9600
;   bridge  Serial3, TX 14 / RX 15 @ 9600
; ---------------------------------------------------------------------------
[env:court_mega]
platform = atmelavr@5.0.0
board = megaatmega2560
framework = arduino
board_build.f_cpu = 16000000L
; No monitor_speed, deliberately. The Mega never opens Serial0: its two UARTs
; are the scanner on Serial2 and the bridge on Serial3, both fixed at 9600 by
; Pins.h, and nothing in court_mega/ or lib/courtlogic calls Serial.begin(). A
; monitor speed here described a stream that does not exist, and a technician
; running `pio device monitor` on it read the resulting silence as a dead board.
upload_speed = 115200
build_flags =
    ${common.build_flags}
    -Wall -Wextra
    -DTARGET_COURT_MEGA=1
    -DLCD_COLS=16 -DLCD_ROWS=2
    -DLCD_PHYSICAL_COLS=20 -DLCD_PHYSICAL_ROWS=4
    -DRELAY_ACTIVE_LOW=1
    -DSCANNER_BAUD=9600 -DBRIDGE_BAUD=9600
    -DRELAY_HARD_CAP_MS=5400000UL
; The Arduino AVR builder APPENDS `-std=gnu++11` to CXXFLAGS after build_flags
; have been processed, so [common]'s `-std=gnu++17` lost every time and the
; whole of lib/ — which is full of C++17 `inline constexpr` variables — could
; never compile for this board. Unflagging it is what lets ours win. This was
; invisible for as long as `pio run` was broken by the library coordinate above.
build_unflags = -std=gnu++11
build_src_filter = +<court_mega/> +<common/>
lib_deps =
    ; marcoschwartz/, NOT johnrickman/. Both publish "LiquidCrystal_I2C 1.1.4" with
    ; the same API, but johnrickman's exists only as a GitHub repo in the Arduino
    ; Library Manager index — it has never been in the PlatformIO registry, so that
    ; coordinate resolves to UnknownPackageError and `pio run -e court_mega` has
    ; never once completed. `pio pkg search LiquidCrystal_I2C` lists marcoschwartz's
    ; and not johnrickman's; that is the whole of the difference.
    ;
    ; Do NOT "correct" the owner back. If a future change really needs johnrickman's
    ; fork, it has to be pinned as a git URL, not as a registry coordinate.
    marcoschwartz/LiquidCrystal_I2C@1.1.4
test_ignore = *

; ---------------------------------------------------------------------------
; Court box — BENCH ONLY. Identical to court_mega except that it stalls a pass
; of loop() sixty seconds after boot, so the go-live watchdog check has
; something to observe.
;
; It exists because the Wire timeout added for the I2C wedge made the previous
; bench check unfirable: shorting SDA now costs 25 ms per write and the holdoff
; skips the next twenty, so loop() returns and the watchdog never fires — the
; correct behaviour, and a test that can no longer fail (review 3, finding 11).
; The SDA short proves the timeout and the holdoff; THIS build proves the
; watchdog and, with it, whether this board's stk500v2 bootloader survives a WDT
; reset — the Mega's one hard-safety property, and the only one no host test can
; reach.
;
; NEVER upload this to a club box. Nothing in CI builds it and it is not in
; default_envs; the flag exists in this one environment and nowhere else.
[env:court_mega_bench]
extends = env:court_mega
build_flags =
    ${env:court_mega.build_flags}
    -DWDT_BENCH_STALL=1

; ---------------------------------------------------------------------------
; Court brain — the onboard ESP8266. Protocol, state, roster cache and the event
; queue live here. 4M2M gives 1 MB max sketch plus 2 MB LittleFS; the filesystem
; is not optional — it holds the device credential and the API base URL, which
; is what stops a power cycle re-provisioning the box. The WiFi credential is
; NOT in there: it is compiled in from src/common/secrets.h, and court_bridge
; refuses to build without one.
; ---------------------------------------------------------------------------
[env:court_bridge]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
; 9600, not 115200: the ESP's UART0 IS the Mega link, and DIP 5,6 route that
; same UART to USB for monitoring. A monitor opened at 115200 shows framing
; garbage that reads as a corrupted board during exactly the site visit where
; that misdiagnosis costs the most.
monitor_speed = 9600
build_flags =
    ${common.build_flags}
    -Wall -Wextra
    -DTARGET_COURT_BRIDGE=1
    -DHEARTBEAT_INTERVAL_MS=30000UL
    -DAUTH_TTL_MS=30000UL
    -DROSTER_MAX_AGE_MS=21600000UL
    -DEVENTQ_SLOTS=64
    ; The bridge display-clamps grants to the same 90 minutes the Mega enforces.
    ; Defining the flag here activates Protocol.h's drift assert in THIS build
    ; too, so the two halves cannot disagree about the cap without a compile error.
    -DRELAY_HARD_CAP_MS=5400000UL
build_src_filter = +<court_bridge/> +<common/>
lib_deps =
    bblanchon/ArduinoJson@7.2.1
test_ignore = *

; ---------------------------------------------------------------------------
; Native device simulator — the SAME lib/ logic behind a POSIX HAL and a real
; TCP listener, so the .NET integration tests run against a real implementation
; of the device protocol instead of a hand-written stub that only ever agrees
; with itself.
; ---------------------------------------------------------------------------
[env:simulator]
platform = native
build_flags = ${strict_host.build_flags} -O1 -g -DSIMULATOR_BUILD=1
build_src_filter = +<simulator/> +<common/>
test_ignore = *
