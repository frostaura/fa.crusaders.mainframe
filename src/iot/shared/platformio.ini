; Crusaders Mainframe — the device-agnostic firmware libraries.
;
; This project builds NOTHING for a board. It exists so that `lib/` here can be
; proven on the host on its own terms, without a court box's protocol codec, its
; relay timer or its composition root anywhere in the picture. Each firmware
; project beside it (`../court-box`, and whatever comes next) reaches these
; libraries with `lib_extra_dirs = ../shared/lib` and adds its own.
;
; WHAT BELONGS HERE
; -----------------
; A library earns a place in this directory when it is true of ANY Crusaders
; device, not of one box's hardware:
;
;   timebase/   rollover-safe millis() primitives      ← read this first
;   hal/        port interfaces + null implementations
;   hal_fakes/  recording test doubles
;   devcrypto/  lowercase hex encode/decode
;   fwversion/  the FW_VERSION_* string
;   devapi/     the bearer header, the response-status policy, a heapless JSON scanner
;   eventq/     what the device DID, queued until the API can hear about it
;   roster/     who may open what, cached and age-limited
;   devlink/    the heartbeat body and its interval, one event as an upload body,
;               the roster push out of a heartbeat response, and the circuit
;               breaker in front of every call
;
; A library that knows about a relay, a DIP switch, a serial dialect or a court
; does NOT belong here — it belongs in the firmware project that owns that
; hardware. The test of a change is whether a second, unrelated device would
; still want it.
;
; The same purity rule as the firmware projects applies and is enforced by the
; same `make lint-iot` gate: no Arduino headers anywhere under lib/, so every
; module compiles for AVR, Xtensa and the host.
;
;   pio test -e native          unit + property tests for these libraries
;   pio test -e native_asan     the same suite under ASAN + UBSAN

[platformio]
default_envs = native
src_dir = src
lib_dir = lib
test_dir = test

; ---------------------------------------------------------------------------
; Shared settings. Kept byte-identical to ../court-box/platformio.ini's [common]
; and [strict_host] on purpose: these libraries are compiled by BOTH projects and
; a flag that differs between them is a library that behaves differently
; depending on which suite ran it.
; ---------------------------------------------------------------------------
[common]
build_flags =
    -std=gnu++17
    ; The heartbeat reports this as `firmware_version`. The version history
    ; itself is kept with the firmware that ships it — see ../court-box.
    -DFW_VERSION_MAJOR=2
    -DFW_VERSION_MINOR=0
    -DFW_VERSION_PATCH=0

; Host builds get -Wall -Wextra, but NOT -Werror or -Wconversion here.
;
; Those flags apply to every translation unit PlatformIO compiles, including the
; vendored Unity test framework, which does not survive them. Strictness is
; enforced separately and more thoroughly by ../court-box/tools/strict_compile.sh,
; which compiles only our own sources — in EVERY project under src/iot — with the
; full pedantic set as errors.
[strict_host]
build_flags =
    ${common.build_flags}
    -Wall -Wextra
    -DHOST_BUILD=1

; ---------------------------------------------------------------------------
; Host unit tests — the primary gate for these libraries.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = ${strict_host.build_flags} -O1 -g
build_src_filter = -<*>
test_build_src = no

; ASAN/UBSAN flags go in build_flags: the native platform passes them to both the
; compile and the link step, and there is no separate link_flags key.
[env:native_asan]
extends = env:native
build_flags = ${strict_host.build_flags} -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer

[env:native_cov]
extends = env:native
build_flags = ${strict_host.build_flags} -O0 -g --coverage
