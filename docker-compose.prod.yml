# Production stack — the file content behind the Portainer stack for the club.
#
# Mirrors docker-compose.yml but pulls the published multi-arch images instead of building,
# and carries its configuration INLINE: there is no .env behind a Portainer stack, and every
# value a running club needs is in this one file. Edit the lines marked CHANGE-ME once, when the
# stack is created; nothing else needs touching. CI stops at the Docker Hub push — it publishes
# the images this file names and does NOT redeploy; the redeploy is a manual step.
#
# Topology: everything here runs on the one on-premises machine the court box reaches over the
# club LAN. Cloudflared is a service of THIS stack (2026-09-19), so it reaches the gateway by
# service name over the compose bridge rather than via a published port. The gateway is still
# published on 8088 anyway, because the court box is on the LAN and does not come in through
# the tunnel; it dials http://<this machine's LAN address>:8088 (compiled in as the first-boot
# default, changeable afterwards over the heartbeat), so give this machine a DHCP reservation —
# an address that moves after a power cut is a fleet that cannot find its server. The stack
# keeps compose's own bridge rather than host networking because the gateway image reaches the
# API and the SPA by service name (backend:5000, frontend:80), and because the API only believes
# X-Forwarded-* headers from that bridge's pinned subnet — see the note on `networks` below.
#
# WHICH RELEASE RUNS is one variable: CRUSADERS_IMAGE_TAG (Portainer: the stack's
# "Environment variables" panel). Every main push publishes an immutable sha-<commit> tag for all
# three images, and :latest moves to it only after all six image builds passed and only FORWARD.
# Set CRUSADERS_IMAGE_TAG=sha-<40-hex commit> on every redeploy, so the stack itself records what
# it runs and a rollback is that variable put back — docs/runbooks/redeploy-and-rollback.md. Left
# unset it falls back to :latest, which is what this file pulled before 2026-11-13.
#
# Names are the ones the API READS. .NET configuration maps Section__Key to Section:Key; a flat
# name like JWT_SECRET reaches nothing and the API boots on the appsettings.json placeholder,
# which is exactly what the previous compose file did. Keep them as they are.

# The compose bridge is PINNED rather than left to docker's default pool, and the backend below
# names exactly this /24 in Gateway__TrustedProxies.
#
# It sits in 10/8 ON PURPOSE. It used to be 172.29.83.0/24, inside docker's own default address
# pool (172.17.0.0/12, handed out in /16 chunks): once a host accumulated enough bridge networks
# docker allocated 172.29.0.0/16 to something else, that /16 swallowed this /24, and the stack
# failed to deploy with "Pool overlaps with other one on this address space". A range outside
# the default pool cannot be auto-allocated to anything, so the collision cannot recur.
#
# CHECK THIS AGAINST THE CLUB LAN before first deploy — if the club's own network is 10.83.29.x,
# pick another free /24 and change it in BOTH places below (here and Gateway__TrustedProxies).
networks:
  default:
    ipam:
      config:
        - subnet: 10.83.29.0/24

# Every service rotates its json-file log. Docker's default keeps a container's log forever, and
# with the backend logging at Information on a Pi's SD card a full disk was a matter of weeks; a
# full disk stops Postgres writing, which stops bookings and the ledger. 5 x 10 MB per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crusaders
      # Anchored: the backup service below reads the same value (*db-password), so it is changed
      # here and in the backend's connection string — two places, not three.
      POSTGRES_PASSWORD: &db-password CHANGE-ME-strong-database-password
      POSTGRES_DB: crusaders_mainframe
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U crusaders -d crusaders_mainframe" ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # Hands the two backend volumes to the image's non-root user (uid 1654, `app` in the .NET
  # runtime image) before the API starts. The backend image used to run as root, so a volume it
  # created is root-owned, and the first non-root start would fail every photo upload. Idempotent:
  # it touches only what is not already owned, then exits; the backend waits for it.
  volume-init:
    image: postgres:16-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["find /app/media /app/biometric ! -user 1654 -exec chown 1654:1654 {} +"]
    volumes:
      - media_data:/app/media
      - biometric_data:/app/biometric
    logging: *default-logging

  backend:
    image: frostaura/crusaders-mainframe-backend:${CRUSADERS_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      # Every EF Core command used to be logged at Information — 46 lines and ~35 KB a minute with
      # nobody using the club, from the background workers alone. Warnings and errors still log.
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
      # Same password as POSTGRES_PASSWORD above.
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=crusaders_mainframe;Username=crusaders;Password=CHANGE-ME-strong-database-password
      Database__AutoMigrateOnStartup: "true"
      # ---- First-run bootstrap ----
      # Migrations create the SCHEMA. They do not create the club. Without the rows below the
      # database is structurally perfect and completely empty, TenantResolutionMiddleware finds
      # no tenant for the hostname, and every request — register included — answers
      # 404 tenant_not_found. That is how the first deployment of this stack failed.
      #
      # Idempotent and additive: it creates only what is missing and never touches what exists,
      # so leaving it enabled is harmless. Turn it off once the club is up if you prefer.
      # If any value below is missing or unusable the API refuses to start and says which one.
      Bootstrap__Enabled: "true"
      # MUST equal the first label of App__PublicBaseUrl's hostname — the tenant is resolved from
      # that subdomain. crusaders.frostaura.net -> crusaders.
      Bootstrap__TenantSlug: crusaders
      Bootstrap__TenantDisplayName: Crusaders Squash Club
      # The club's first admin. One-time credential: the account is created with
      # must-change-password set, so this password stops working at first sign-in.
      # At least 12 characters, and not one of the placeholders this project has shipped before.
      Bootstrap__AdminEmail: dean.martin@frostaura.net
      Bootstrap__AdminPassword: CHANGE-ME-at-least-12-characters
      Bootstrap__Courts: "4"
      # ---- Device keys (docs/specs/device-api.md §6, §7) ----
      # After a database loss ONLY: the device key every board already holds, from the password
      # manager. Applied to a club with no key, never over a live one; empty does nothing.
      Bootstrap__DeviceApiKey: ""
      # The club's firmware release key's PUBLIC modulus, 512 hex characters, printed by
      # `src/iot/tools/ota_sign.py keygen` (the private half stays in the password manager). It is
      # the same value compiled into every board as OTA_PUBLIC_KEY_N. Empty = signed OTA is off:
      # uploads are refused and no board is offered anything. The corpus TEST key refuses to start.
      DeviceOta__PublicKeyModulus: ""
      # ---- Inherent administrators ----
      # Whoever is listed here holds club-admin rights in every club on this deployment where
      # that address ALREADY has an account. It is applied at sign-in, so an address added
      # later — or a person who registers later — is covered without a restart.
      #
      # It grants the admin flag and nothing else. It is not a password, it does not skip email
      # verification, it does not admit a member the club has suspended or not yet approved, and
      # it never invents a member in a club that person has not joined.
      #
      # DEPLOYMENT-OWNED, NOT CLUB-OWNED — that is why it is here rather than in the club's own
      # settings. The club appoints its own admins from Admin → Members, and those are untouched.
      #
      # Not a secret; nothing here is a credential. It IS security-relevant: editing this line
      # changes who can administer every club on this stack, so it is reviewed, not skimmed.
      #
      # Indexed, one address per line: Admins__Emails__0, Admins__Emails__1, … An empty list is
      # a valid, ordinary configuration — delete the line and the clubs run on their own admins.
      # REMOVING an address does not strip an admin who already has the rights (that would let a
      # typo lock a club out of its own console); it logs a warning, and the rights are removed
      # in Admin → Members.
      Admins__Emails__0: dean.martin@frostaura.net
      # Signs every member and admin session. At least 32 bytes; changing it logs everyone out.
      #
      # Generate it, do not invent it:  openssl rand -base64 48
      #
      # The API now REFUSES TO START on any value that looks published — anything beginning
      # CHANGE-ME, REPLACE_WITH or DEV_ONLY — and the line below is one of them, so a stack
      # deployed without editing it fails loudly at boot. That refusal is the point. Until
      # recently appsettings.json carried a placeholder of its own and Program.cs only checked
      # for null, so a stack missing this key came up perfectly healthy and signed every token
      # with a string published in this repository and baked into the image: enough for anyone
      # holding it to mint a valid administrator token for any tenant. See
      # src/backend/Crusaders.Mainframe.Api/Security/JwtSecretPolicy.cs.
      Jwt__Secret: CHANGE-ME-random-string-of-at-least-32-characters
      # The member-code master key (docs/specs/member-code.md §3.1). Every member's rotating code is
      # HKDF of it, so it is worth more than every code in the club. 32-64 random bytes, base64:
      #     openssl rand -base64 48
      # The API REFUSES TO START on this placeholder, on anything under 32 bytes, and on anything
      # that is not base64. Changing it later re-enrols every phone (no dual-key window in v1).
      MemberCodes__MasterKey: CHANGE-ME-member-code-master-key-openssl-rand-base64-48
      # The address members use. Verification, welcome and password-reset links are built from it,
      # and PayFast is told to return here. Cloudflared points this hostname at the gateway.
      App__PublicBaseUrl: https://crusaders.frostaura.net
      Cors__AllowedOrigins__0: https://crusaders.frostaura.net
      # Loopback plus the ipam subnet pinned above — the network the gateway and cloudflared
      # containers stand on. SET HERE, not left to the appsettings.json default: a redeploy
      # moves images and nothing else, so the image still carries the old 172.29.83.0/24
      # default. Without this line the gateway is an untrusted peer, X-Forwarded-For/-Proto/
      # -Host are ignored, the whole club lands in one rate-limit bucket, and every absolute
      # URL the API composes (verification links, PayFast returns, OTA and provisioning URLs)
      # is built from the gateway's port-less host instead of the public one.
      # Comma-delimited SCALAR, never the indexed form — .NET merges arrays by index, so the
      # indexed form cannot narrow a default, only add to it.
      # Must match the `networks:` subnet above — change the two together.
      Gateway__TrustedProxies: 127.0.0.1,::1,10.83.29.0/24
      # Passkeys are bound to the hostname members sign in on.
      WEBAUTHN_RP_ID: crusaders.frostaura.net
      WEBAUTHN_ORIGIN: https://crusaders.frostaura.net
      WEBAUTHN_RP_NAME: Crusaders Squash
      # Outbound mail: verification, welcome, password reset, receipts, no-show notices.
      Smtp__Host: smtpout.secureserver.net
      Smtp__Port: "587"
      Smtp__User: dean.martin@frostaura.net
      Smtp__Password: CHANGE-ME-mailbox-password
      Smtp__From: crusaders@frostaura.net
      Smtp__FromName: Crusaders Squash
      Media__StoragePath: /app/media
      Biometric__TemplateStorePath: /app/biometric/templates
    volumes:
      - media_data:/app/media
      - biometric_data:/app/biometric
    healthcheck:
      # /readyz, not /healthz (IO-16): healthy means the API reached its database, so a Postgres
      # outage shows as an unhealthy backend in Portainer instead of a "healthy" one answering 503.
      test: [ "CMD-SHELL", "curl --fail --silent http://127.0.0.1:5000/readyz >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    logging: *default-logging

  frontend:
    image: frostaura/crusaders-mainframe-frontend:${CRUSADERS_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    logging: *default-logging

  gateway:
    # A built image, not stock nginx:alpine with the config bind-mounted: the release chain moves
    # images and nothing else, so a stack that does not NAME this image keeps its old gateway
    # config through every redeploy. CI no longer checks for that — it is on whoever redeploys.
    image: frostaura/crusaders-mainframe-gateway:${CRUSADERS_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      # STILL PUBLISHED, even though cloudflared now runs inside this stack and reaches the
      # gateway by service name. Cloudflared carries members in from the internet; it does NOT
      # carry the court box, which is on the club LAN and dials
      # http://<this machine's LAN address>:8088 out of its own secrets.h. Drop this line and
      # members keep booking while the courts stop responding — a failure that looks like
      # broken hardware and is not.
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    logging: *default-logging

  # The public edge. Inside this stack rather than beside it, so it reaches the gateway by
  # service name over the pinned bridge — which also puts it inside Gateway__TrustedProxies
  # above, which is what lets the API believe the X-Forwarded-* headers it sets. Jwt__Secret
  # aside, this token is the most sensitive value in the file: anyone holding it can run the
  # tunnel. Rotate it in the Cloudflare dashboard if it is ever pasted anywhere.
  #
  # ForwardLimit is 2 in appsettings.json, which is exactly this chain: cloudflared -> gateway
  # -> API. Adding another proxy in front means raising it, or every member's client IP
  # collapses to the gateway's.
  #
  # PINNED to a release rather than :latest, like every third-party image here: a redeploy then
  # changes only what this repository changed. Bump it deliberately (Docker Hub
  # cloudflare/cloudflared tags are the CalVer releases).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: always
    depends_on:
      - gateway
    command: tunnel run --token "CHANGE-ME-cloudflare-tunnel-token"
    logging: *default-logging

  # Backups — the database AND the uploaded photos, daily, with retention. Money is ledger-only
  # and the device API key every court box and door carries lives only in the `tenants` table:
  # a lost Postgres volume, restored from nothing, is every member's balance gone AND a fleet of
  # boxes holding a key the new database has never seen.
  #
  # What it does: at BACKUP_HOUR_UTC every day (and at once on a host with no backup at all) it
  # writes crusaders-daily-<UTC stamp>.dump (pg_dump custom format, verified readable with
  # pg_restore --list before it is kept) and a .media.tar.gz of the photos beside it, into
  # CRUSADERS_BACKUP_DIR on the HOST. Backups older than BACKUP_KEEP_DAYS are deleted, but never
  # the newest BACKUP_KEEP_MIN, however old: a job that failed for a month must not prune away the
  # last good copy. The container goes unhealthy when the newest dump is over 26 hours old.
  #
  # THE SAME SD CARD IS NOT A BACKUP. This writes to the host so the offsite copy is a host-level
  # step — docs/runbooks/backup-and-restore.md has the command, and go-live checklist §2b makes it
  # a precondition. The dumps hold password hashes, members' e-mail addresses and the device key:
  # encrypt them on the way off the host.
  #
  # Three commands are installed in the container, all documented in that runbook:
  #   docker exec <this container> crusaders-backup predeploy     # a backup now, before a redeploy
  #   docker exec <this container> crusaders-prune                # apply retention now
  #   docker exec <this container> crusaders-restore <file.dump> crusaders_mainframe
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: crusaders
      PGPASSWORD: *db-password
      PGDATABASE: crusaders_mainframe
      # 00:00 UTC is 02:00 at the club: after the last court, before the first.
      BACKUP_HOUR_UTC: "0"
      BACKUP_KEEP_DAYS: "14"
      BACKUP_KEEP_MIN: "3"
    volumes:
      - ${CRUSADERS_BACKUP_DIR:-/var/backups/crusaders-mainframe}:/backups
      # Read-write because crusaders-restore puts the photos back.
      - media_data:/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "find /backups -maxdepth 1 -name 'crusaders-*.dump' -mmin -1560 | grep -q ." ]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 10m
    logging: *default-logging
    entrypoint: [ "/bin/sh", "-c" ]
    # Inline because a Portainer stack has no files beside it. Every `$$` is compose's escape for
    # a literal `$`; the scripts are written into the container at start and the loop runs them.
    command:
      - |
        set -eu
        cat > /usr/local/bin/crusaders-backup <<'EOF'
        #!/bin/sh
        # crusaders-backup [label] - the database and the photos, now, side by side in /backups.
        set -eu
        umask 077
        label="$${1:-manual}"
        case "$$label" in
          ""|*[!a-z0-9-]*) echo "backup: the label is lower-case letters, digits and dashes" >&2; exit 2 ;;
        esac
        name="crusaders-$$label-$$(date -u +%Y%m%dT%H%M%SZ)"
        part="/backups/.$$name.partial"
        trap 'rm -f "$$part.dump" "$$part.media.tar.gz"' EXIT
        pg_dump --format=custom --compress=6 --file="$$part.dump"
        pg_restore --list "$$part.dump" > /dev/null
        tar -C /media -czf "$$part.media.tar.gz" .
        mv "$$part.media.tar.gz" "/backups/$$name.media.tar.gz"
        mv "$$part.dump" "/backups/$$name.dump"
        trap - EXIT
        echo "backup: wrote /backups/$$name.dump ($$(du -k "/backups/$$name.dump" | cut -f1) KiB) and its media archive"
        EOF
        cat > /usr/local/bin/crusaders-prune <<'EOF'
        #!/bin/sh
        # crusaders-prune - deletes backups older than BACKUP_KEEP_DAYS, never the newest BACKUP_KEEP_MIN.
        set -eu
        keep_days="$${BACKUP_KEEP_DAYS:-14}"
        keep_min="$${BACKUP_KEEP_MIN:-3}"
        n=0
        for f in $$(ls -1t /backups/crusaders-*.dump 2> /dev/null); do
          n=$$((n + 1))
          if [ "$$n" -le "$$keep_min" ]; then continue; fi
          if [ -n "$$(find "$$f" -mtime +"$$keep_days")" ]; then
            rm -f "$$f" "$${f%.dump}.media.tar.gz"
            echo "backup: pruned $$f"
          fi
        done
        EOF
        cat > /usr/local/bin/crusaders-restore <<'EOF'
        #!/bin/sh
        # crusaders-restore <file.dump> <database name> - REPLACES the database (and the photos).
        set -eu
        dump="$${1:-}"
        confirm="$${2:-}"
        if [ -z "$$dump" ]; then echo "usage: crusaders-restore <crusaders-...dump> $$PGDATABASE" >&2; exit 2; fi
        case "$$dump" in /*) ;; *) dump="/backups/$$dump" ;; esac
        if [ ! -f "$$dump" ]; then echo "restore: $$dump does not exist" >&2; exit 2; fi
        if [ "$$confirm" != "$$PGDATABASE" ]; then
          echo "restore: this REPLACES database $$PGDATABASE; repeat its name as the second argument" >&2; exit 2
        fi
        pg_restore --list "$$dump" > /dev/null
        others="$$(psql -d postgres -Atc "select count(*) from pg_stat_activity where datname = '$$PGDATABASE'")"
        if [ "$$others" != "0" ]; then
          echo "restore: $$others connection(s) to $$PGDATABASE are open - stop the backend first" >&2; exit 3
        fi
        if ! crusaders-backup pre-restore; then
          echo "restore: WARNING - the safety backup of the current database failed; restoring anyway" >&2
        fi
        psql -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS \"$$PGDATABASE\"" -c "CREATE DATABASE \"$$PGDATABASE\""
        pg_restore --dbname="$$PGDATABASE" --exit-on-error --no-owner "$$dump"
        media="$${dump%.dump}.media.tar.gz"
        if [ -f "$$media" ]; then
          find /media -mindepth 1 -delete
          tar -C /media -xzf "$$media"
          echo "restore: photos restored from $$media"
        else
          echo "restore: no media archive beside the dump; the photos were left as they are" >&2
        fi
        echo "restore: newest migration is $$(psql -Atc 'select max("MigrationId") from "__EFMigrationsHistory"')"
        echo "restore: done - start the backend"
        EOF
        cat > /usr/local/bin/crusaders-backup-loop <<'EOF'
        #!/bin/sh
        set -u
        echo "backup: daily at $${BACKUP_HOUR_UTC:-0}:00 UTC into /backups, kept $${BACKUP_KEEP_DAYS:-14} days, never fewer than $${BACKUP_KEEP_MIN:-3}"
        while :; do
          today="$$(date -u +%Y%m%d)"
          hour="$$(date -u +%H | sed 's/^0//')"
          if ! ls /backups/crusaders-daily-"$$today"T*.dump > /dev/null 2>&1; then
            if [ "$${hour:-0}" -ge "$${BACKUP_HOUR_UTC:-0}" ] || ! ls /backups/crusaders-*.dump > /dev/null 2>&1; then
              if crusaders-backup daily; then crusaders-prune; else echo "backup: FAILED - retrying in five minutes" >&2; fi
            fi
          fi
          sleep 300
        done
        EOF
        chmod 755 /usr/local/bin/crusaders-backup /usr/local/bin/crusaders-prune /usr/local/bin/crusaders-restore /usr/local/bin/crusaders-backup-loop
        exec crusaders-backup-loop

volumes:
  postgres_data:
  media_data:
  biometric_data:
