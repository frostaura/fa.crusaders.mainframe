# On-premises overlay — apply at the club, on top of the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.onprem.yml up -d
#
# ---------------------------------------------------------------------------
# Why this file exists
# ---------------------------------------------------------------------------
# It existed for UDP discovery. A court box used to announce itself on
# 255.255.255.255:48653 and the API listened for it, and broadcast frames do not
# cross a docker bridge — so the listener inside a bridged container received
# nothing at all, not intermittently but never. Host networking was the only
# workaround that did not bake a NIC name into a compose file.
#
# **There is no discovery any more.** A box carries the club's API key, calls the
# API by the URL compiled into its secrets.h, and registers itself on its first
# heartbeat; nothing broadcasts and nothing listens. So this overlay is now a
# CHOICE rather than a requirement: the base file is sufficient at a club, and a
# club that runs it alone gets a backend on the bridge, reached through the
# gateway on :8088, exactly as the boxes expect.
#
# What it still buys, for a club that wants it: the database and MailHog bound to
# the host loopback instead of published, and Kestrel bound to two addresses
# rather than every interface. Both are hardening, not connectivity.
#
# ---------------------------------------------------------------------------
# What host networking breaks, and what to set because of it
# ---------------------------------------------------------------------------
# 1. Service-name DNS. A host-networked container is not on the compose bridge,
#    so `postgres`, `mailhog` and `frontend` no longer resolve from the backend.
#    Postgres and MailHog therefore publish to the host loopback below, and the
#    backend addresses them as 127.0.0.1.
#
# 2. The reverse proxy's upstream. nginx still resolves `backend`, so the
#    gateway gets an extra_hosts entry pointing that name at the docker host.
#    nginx.conf is untouched.
#
# 3. Port conflicts are now real. 5000/tcp must be free on the host. A second
#    stack on the same machine will not start, which is correct.
#
# 4. **Kestrel is bound explicitly, not to every interface.** Host networking
#    used to put the API on :5000 on every host interface — the club LAN
#    included. Combined with the API's old `172.16.0.0/12` trusted-proxy default
#    that was a hole: a laptop on a 172.16.x.x club LAN could POST straight to
#    :5000 with a rotating `X-Forwarded-For` and guess passwords past every rate
#    limit, because the API believed the header from anything inside the /12
#    (round-3 finding 15). The trusted range is now the compose bridge alone, and
#    ASPNETCORE_URLS below binds loopback plus the one address the gateway dials.
#
#    **The boxes are unaffected.** They reach the API through the gateway on
#    :8088, which is the address in their secrets.h and the only one the topology
#    in docs/specs/deployment.md gives them. Direct :5000 from the LAN was a side
#    effect of host networking, never a path the system hands out.
#
services:
  postgres:
    # Reachable from the host-networked backend. Bound to loopback rather than
    # 0.0.0.0 so the club LAN cannot reach the database directly.
    ports:
      - "127.0.0.1:5432:5432"

  mailhog:
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:8025:8025"

  backend:
    network_mode: host
    environment:
      # Loopback for the healthcheck and anything on the host, plus the ONE address the
      # gateway container dials: `extra_hosts: backend:host-gateway` below resolves to the
      # host's docker bridge address, 172.17.0.1 on a stock daemon. Confirm it on this host
      #
      #   docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}'
      #
      # and set BACKEND_BIND_ADDRESS in .env if it differs (a custom --host-gateway-ip, or
      # a daemon whose default bridge was re-pooled). Getting it wrong is loud rather than
      # silent: nginx answers 502 and the healthcheck still passes on loopback.
      #
      # This is what closes the LAN's direct route to :5000. See note 4 in the header.
      ASPNETCORE_URLS: http://127.0.0.1:5000;http://${BACKEND_BIND_ADDRESS:-172.17.0.1}:5000

      # Service names are gone with the bridge; everything is loopback now.
      ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=${POSTGRES_DB:-crusaders_mainframe};Username=${POSTGRES_USER:-crusaders};Password=${POSTGRES_PASSWORD}
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 11025

      # LAN webhook consumers — see go-live checklist item 12. The court box is
      # pull-only and never a webhook destination; uncomment only for a genuine
      # LAN consumer, on a DHCP reservation.
      # Webhooks__AllowPrivateNetworks: "false"
      # Webhooks__PrivateNetworkAllowList__0: "10.0.40.7/32"

  gateway:
    # nginx proxies to http://backend:5000. With the backend on the host that
    # name no longer resolves through docker DNS, so it is pointed at the host
    # gateway address instead and nginx.conf stays as it is.
    #
    # The gateway reaches the host-networked backend FROM the compose bridge, so
    # the backend sees it as a 172.29.83.0/24 peer — the ipam subnet pinned in
    # docker-compose.yml, which is the API's default Gateway:TrustedProxies — and
    # believes its X-Forwarded-* headers: that is what gives every member their own
    # rate-limit bucket rather than one shared club-wide one.
    #
    # cloudflared runs on this host and dials the published gateway port, so the
    # gateway sees it as the bridge's own gateway address — also inside that /24,
    # which is what lets Gateway:ForwardLimit=2 walk back past cloudflared to the
    # real visitor. A club that fronts the API with anything else sets
    # GATEWAY_TRUSTED_PROXIES to a comma-delimited list (see .env.example).
    extra_hosts:
      - "backend:host-gateway"
