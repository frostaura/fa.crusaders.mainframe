# The compose bridge is PINNED rather than left to docker's default pool, and the API's
# Gateway:TrustedProxies default names exactly this /24. Left to the pool, the only honest
# default was "trust 172.16.0.0/12" — a million addresses, and on a club whose LAN happens to
# sit in that range every laptop became a trusted proxy able to forge X-Forwarded-For and
# escape every rate limit (round-3 finding 15). Change this subnet and you must change
# `Gateway.TrustedProxies` in src/backend/Crusaders.Mainframe.Api/appsettings.json,
# GatewayTrust.ComposeBridgeNetwork, and the note in .env.example — all four together.
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.83.0/24

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crusaders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-crusaders_mainframe}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crusaders} -d ${POSTGRES_DB:-crusaders_mainframe}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: jcalonso/mailhog:latest
    ports:
      - "${MAILHOG_SMTP_PORT:-11025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    expose:
      - "1025"
      - "8025"

  backend:
    build:
      context: .
      dockerfile: ./src/backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-crusaders_mainframe};Username=${POSTGRES_USER:-crusaders};Password=${POSTGRES_PASSWORD}
      Database__AutoMigrateOnStartup: ${DATABASE__AUTOMIGRATEONSTARTUP:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-crusaders.mainframe}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-crusaders.mainframe.app}
      MASTER_SECRETS_ENCRYPTION_KEY: ${MASTER_SECRETS_ENCRYPTION_KEY:?MASTER_SECRETS_ENCRYPTION_KEY is required}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@crusadersmainframe.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Crusaders Mainframe}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:8088}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8088}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://localhost:4173}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:8088,http://localhost:4173}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Crusaders Mainframe}
      MEDIA_STORAGE_PATH: ${MEDIA_STORAGE_PATH:-/app/media}
      BIOMETRIC_DRIVER: ${BIOMETRIC_DRIVER:-Null}
      BIOMETRIC_TEMPLATE_STORE_PATH: ${BIOMETRIC_TEMPLATE_STORE_PATH:-/app/biometric/templates}
      # Everything below was documented in .env.example and deployment.md as settable in
      # .env and was reaching nothing: this list is an allow-list, and a name absent from
      # it is silently dropped. A comma-delimited TrustedProxies (not the indexed form)
      # because indexed configuration merges by index and so cannot narrow a default —
      # see GatewayTrust.
      # Each carries the appsettings.json default explicitly rather than an empty string:
      # an empty environment variable does not mean "absent" to .NET configuration, it
      # SHADOWS the file value with "", which for TrustedProxies would have silently
      # dropped the deployment to loopback-only and stopped the gateway being believed.
      Gateway__TrustedProxies: ${GATEWAY_TRUSTED_PROXIES:-127.0.0.1,::1,172.29.83.0/24}
      Gateway__ForwardLimit: ${GATEWAY_FORWARD_LIMIT:-2}
      RateLimits__FirmwarePerMinute: ${RATELIMITS_FIRMWARE_PER_MINUTE:-10}
      Discovery__DowngradeHttpsAdvertisedBaseUrl: ${DISCOVERY_DOWNGRADE_HTTPS_ADVERTISED_BASE_URL:-false}
      # The OTA override. All three keys of a section or none — a partial section is a
      # startup refusal by design (OtaCatalogue), which is why they are forwarded as one
      # block: forwarding some and not others would manufacture exactly that refusal.
      Ota__Stable__Version: ${OTA_STABLE_VERSION:-}
      Ota__Stable__Url: ${OTA_STABLE_URL:-}
      Ota__Stable__SizeBytes: ${OTA_STABLE_SIZE_BYTES:-}
      Ota__Canary__Version: ${OTA_CANARY_VERSION:-}
      Ota__Canary__Url: ${OTA_CANARY_URL:-}
      Ota__Canary__SizeBytes: ${OTA_CANARY_SIZE_BYTES:-}
    expose:
      - "5000"
    volumes:
      - media_data:/app/media
      - biometric_data:/app/biometric
    # Biometric peripheral passthrough — enabled when a real driver is selected.
    # Example for a USB fingerprint reader:
    # devices:
    #   - "/dev/bus/usb/001/004:/dev/bus/usb/001/004"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:5000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: ./src/frontend/Dockerfile
      args:
        VITE_SHOW_DEV_LOGIN: ${VITE_SHOW_DEV_LOGIN:-false}
    depends_on:
      - backend

  gateway:
    # Built and pushed like the other two, NOT stock nginx:alpine with the config
    # bind-mounted. The deploy chain moves images and nothing else, so a bind-mounted
    # nginx.conf is a file the release cannot deliver: a club merging a gateway fix got a
    # new backend behind the old config, with the dashboard saying deployed. See
    # nginx/Dockerfile for what that cost.
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ${GATEWAY_IMAGE:-crusaders-mainframe-gateway:local}
    ports:
      - "${GATEWAY_PORT:-8088}:80"
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
      NGINX_BACKEND_PORT: ${NGINX_BACKEND_PORT:-5000}
      NGINX_FRONTEND_PORT: ${NGINX_FRONTEND_PORT:-80}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-10m}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres_data:
  media_data:
  biometric_data:
