services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crusaders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-crusaders_mainframe}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crusaders} -d ${POSTGRES_DB:-crusaders_mainframe}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: jcalonso/mailhog:latest
    ports:
      - "${MAILHOG_SMTP_PORT:-11025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    expose:
      - "1025"
      - "8025"

  backend:
    build:
      context: .
      dockerfile: ./src/backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-crusaders_mainframe};Username=${POSTGRES_USER:-crusaders};Password=${POSTGRES_PASSWORD}
      Database__AutoMigrateOnStartup: ${DATABASE__AUTOMIGRATEONSTARTUP:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-crusaders.mainframe}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-crusaders.mainframe.app}
      MASTER_SECRETS_ENCRYPTION_KEY: ${MASTER_SECRETS_ENCRYPTION_KEY:?MASTER_SECRETS_ENCRYPTION_KEY is required}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@crusadersmainframe.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Crusaders Mainframe}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:8088}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8088}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://localhost:4173}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:8088,http://localhost:4173}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Crusaders Mainframe}
      MEDIA_STORAGE_PATH: ${MEDIA_STORAGE_PATH:-/app/media}
      PEACH_PAYMENTS_BASE_URL: ${PEACH_PAYMENTS_BASE_URL:-https://test.oppwa.com}
      BIOMETRIC_DRIVER: ${BIOMETRIC_DRIVER:-Null}
      BIOMETRIC_TEMPLATE_STORE_PATH: ${BIOMETRIC_TEMPLATE_STORE_PATH:-/app/biometric/templates}
    expose:
      - "5000"
    volumes:
      - media_data:/app/media
      - biometric_data:/app/biometric
    # Biometric peripheral passthrough — enabled when a real driver is selected.
    # Example for a USB fingerprint reader:
    # devices:
    #   - "/dev/bus/usb/001/004:/dev/bus/usb/001/004"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:5000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: ./src/frontend/Dockerfile
      args:
        VITE_SHOW_DEV_LOGIN: ${VITE_SHOW_DEV_LOGIN:-false}
    depends_on:
      - backend

  gateway:
    image: nginx:alpine
    ports:
      - "${GATEWAY_PORT:-8088}:80"
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
      NGINX_BACKEND_PORT: ${NGINX_BACKEND_PORT:-5000}
      NGINX_FRONTEND_PORT: ${NGINX_FRONTEND_PORT:-80}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-10m}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres_data:
  media_data:
  biometric_data:
