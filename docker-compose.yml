# The compose bridge is PINNED rather than left to docker's default pool, and the API's
# Gateway:TrustedProxies default names exactly this /24. Left to the pool, the only honest
# default was "trust 172.16.0.0/12" — a million addresses, and on a club whose LAN happens to
# sit in that range every laptop became a trusted proxy able to forge X-Forwarded-For and
# escape every rate limit (round-3 finding 15). Change this subnet and you must change
# `Gateway.TrustedProxies` in src/backend/Crusaders.Mainframe.Api/appsettings.json,
# GatewayTrust.ComposeBridgeNetwork, and the note in .env.example — all four together.
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.83.0/24

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crusaders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-crusaders_mainframe}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crusaders} -d ${POSTGRES_DB:-crusaders_mainframe}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: jcalonso/mailhog:latest
    ports:
      - "${MAILHOG_SMTP_PORT:-11025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    expose:
      - "1025"
      - "8025"

  backend:
    build:
      context: .
      dockerfile: ./src/backend/Dockerfile
    environment:
      # Names are the ones the API READS (Section__Key -> Section:Key). The flat names this
      # block used to carry — JWT_SECRET, APP_FRONTEND_URL, CORS_ALLOWED_ORIGINS,
      # MASTER_SECRETS_ENCRYPTION_KEY and friends — were read by nothing, so the API booted on
      # the appsettings.json placeholders while the file demanded values for them. This list is
      # also an allow-list: a name absent from it reaches the API not at all.
      # Production by default, and Development only when somebody asks for it.
      #
      # This is the unqualified compose file — the one anyone reaches for first — and it used to
      # default to Development. Development turns on POST /api/v1/auth/dev/admin-login, which is
      # anonymous, returns an admin JWT, force-resets the seeded admin's password, and from there
      # reaches the full member list and the device API key that switches the club's lights. It
      # also runs the Development seeder against whatever database is configured and puts .NET
      # stack traces in 400 bodies. One `docker compose up` against a club's real database was
      # all of that, in one step, with nothing in CI checking for it.
      #
      # Local development is unaffected: this file cannot start without a .env (JWT_SECRET is
      # `:?required`), and .env.example sets ASPNETCORE_ENVIRONMENT=Development.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-crusaders_mainframe};Username=${POSTGRES_USER:-crusaders};Password=${POSTGRES_PASSWORD}
      Database__AutoMigrateOnStartup: ${DATABASE__AUTOMIGRATEONSTARTUP:-true}
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      App__PublicBaseUrl: ${APP_PUBLIC_BASE_URL:-http://localhost:8088}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-http://localhost:8088}
      Cors__AllowedOrigins__1: http://localhost:4173
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:8088,http://localhost:4173}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Crusaders Mainframe}
      # First-run bootstrap. Defaults to FALSE here: in Development the Seeder below already
      # creates the tenant, and turning both on would have the bootstrap win the race for the
      # courts and price them at its own rate rather than the seeder's. Set BOOTSTRAP_ENABLED=true
      # in .env when running this stack with ASPNETCORE_ENVIRONMENT=Production locally, which is
      # the configuration the club actually runs and the one worth rehearsing before a deploy.
      Bootstrap__Enabled: ${BOOTSTRAP_ENABLED:-false}
      Bootstrap__TenantSlug: ${BOOTSTRAP_TENANT_SLUG:-crusaders}
      Bootstrap__TenantDisplayName: ${BOOTSTRAP_TENANT_DISPLAY_NAME:-Crusaders Squash Club}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      Bootstrap__Courts: ${BOOTSTRAP_COURTS:-4}
      Bootstrap__SlicePriceCredits: ${BOOTSTRAP_SLICE_PRICE_CREDITS:-8}
      # Inherent administrators of the deployment — club-admin rights in every club where that
      # address already has an account. Deployment-owned, not club-owned; not a secret, but
      # security-relevant. The full note is in docker-compose.prod.yml and appsettings.json.
      #
      # It carries the appsettings.json default explicitly, for the reason the TrustedProxies
      # note below spells out: an empty environment variable does not mean "absent" to .NET
      # configuration, it SHADOWS the file value with "" — and an "" entry is exactly what this
      # list discards, so `${ADMINS_EMAILS_0:-}` would silently delete the shipped default here
      # and nowhere else.
      Admins__Emails__0: ${ADMINS_EMAILS_0:-dean.martin@frostaura.net}
      Smtp__Host: ${SMTP_HOST:-mailhog}
      Smtp__Port: ${SMTP_PORT:-1025}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-noreply@crusadersmainframe.local}
      Smtp__FromName: ${SMTP_FROM_NAME:-Crusaders Mainframe}
      Media__StoragePath: /app/media
      Biometric__TemplateStorePath: /app/biometric/templates
      # A comma-delimited TrustedProxies (not the indexed form) because indexed configuration
      # merges by index and so cannot narrow a default — see GatewayTrust. Each carries the
      # appsettings.json default explicitly rather than an empty string: an empty environment
      # variable does not mean "absent" to .NET configuration, it SHADOWS the file value with "".
      Gateway__TrustedProxies: ${GATEWAY_TRUSTED_PROXIES:-127.0.0.1,::1,172.29.83.0/24}
      Gateway__ForwardLimit: ${GATEWAY_FORWARD_LIMIT:-2}
    expose:
      - "5000"
    volumes:
      - media_data:/app/media
      - biometric_data:/app/biometric
    # Biometric peripheral passthrough — enabled when a real driver is selected.
    # Example for a USB fingerprint reader:
    # devices:
    #   - "/dev/bus/usb/001/004:/dev/bus/usb/001/004"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:5000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started

  frontend:
    # No build args. `VITE_SHOW_DEV_LOGIN` used to be passed through here, defaulting to
    # false — which reads as safe and is not, because it made "print the seeded admin's
    # e-mail and password on the sign-in screen" a one-word change in an unreviewed .env
    # file, on the one surface that is public by definition. The dev-shortcuts block is
    # gated on `import.meta.env.DEV`, which vite resolves at build time and the minifier
    # deletes from a production bundle; an override is the only thing that could defeat
    # that. Pinned by src/frontend/src/production-posture.test.ts.
    build:
      context: .
      dockerfile: ./src/frontend/Dockerfile
    depends_on:
      - backend

  gateway:
    # Built and pushed like the other two, NOT stock nginx:alpine with the config
    # bind-mounted. The deploy chain moves images and nothing else, so a bind-mounted
    # nginx.conf is a file the release cannot deliver: a club merging a gateway fix got a
    # new backend behind the old config, with the dashboard saying deployed. See
    # nginx/Dockerfile for what that cost.
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ${GATEWAY_IMAGE:-crusaders-mainframe-gateway:local}
    ports:
      - "${GATEWAY_PORT:-8088}:80"
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
      NGINX_BACKEND_PORT: ${NGINX_BACKEND_PORT:-5000}
      NGINX_FRONTEND_PORT: ${NGINX_FRONTEND_PORT:-80}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-10m}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres_data:
  media_data:
  biometric_data:
