name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================================
  # Backend — lint, build, test (.NET 10)
  # ============================================================================
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./src/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: |
          dotnet restore Crusaders.Mainframe.Api/Crusaders.Mainframe.Api.csproj
          dotnet restore Crusaders.Mainframe.Tests/Crusaders.Mainframe.Tests.csproj

      - name: Build
        run: |
          dotnet build Crusaders.Mainframe.Api/Crusaders.Mainframe.Api.csproj --nologo -v q
          dotnet build Crusaders.Mainframe.Tests/Crusaders.Mainframe.Tests.csproj --nologo -v q

      # NO COVERAGE THRESHOLD HERE, DELIBERATELY — it is enforced in
      # `backend-integration`, and the reason is that this job has no Postgres.
      #
      # Every Postgres-backed test skips itself when the connection string is absent, which
      # is 1017 of 2209 — so this job exercises 54% of the suite and then a 70% line-coverage
      # rule was applied to the result. That rule was not measuring the product's coverage; it
      # was measuring how much of the product happens to be reachable without a database, and
      # it fell below the line the moment a release added code that is exercised through one.
      #
      # A threshold a tier cannot structurally satisfy teaches people to edit the threshold.
      # The number is now taken where the whole suite actually runs.
      - name: Test
        run: dotnet test Crusaders.Mainframe.Tests/Crusaders.Mainframe.Tests.csproj --nologo -v q

  # ============================================================================
  # Frontend — lint, build, test (Node 22 / React 19 / Vite 7)
  # ============================================================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./src/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ./src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --run

  # ============================================================================
  # End-to-end — the real built frontend in a real browser
  #
  # A separate job from `frontend` on purpose: it needs a browser download and a dev
  # server, and folding that into the fast unit job would slow every push for a check
  # that answers a different question. What it catches is what a unit test cannot —
  # that the screens compose, navigate, and put the right numbers in front of a
  # person. The API is intercepted; the server's own behaviour is held by the backend
  # and backend-integration jobs.
  # ============================================================================
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # 30, not 15. The 15 was set when this job took 4 minutes and the suite was a few hundred
    # specs; it is 644 now, run across a desktop and a mobile project, on top of a browser
    # install and a production build. Measured on the runs of 2026-09-23 it needs the better
    # part of quarter of an hour with everything passing, which left no headroom at all.
    #
    # A budget with no headroom fails in the most expensive way there is: exceeding
    # timeout-minutes reports as CANCELLED, so the job names no test and reads like a hang
    # rather than like arithmetic. It already cost one debugging cycle on this suite, where the
    # real cause was a 2 px badge overflow whose retries — each recording video — ate the
    # margin. See memory/gotchas-ci-jobs.md.
    timeout-minutes: 30
    needs: [frontend]
    defaults:
      run:
        working-directory: ./src/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ./src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --with-deps because a bare GitHub runner is missing the shared libraries
      # Chromium needs, and the failure is a launch error that reads as a Playwright
      # bug rather than as a missing apt package.
      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npx playwright test

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/playwright-report/
          retention-days: 7

  # ============================================================================
  # Backend Integration — real Postgres boundary checks (no EF in-memory)
  # ============================================================================
  backend-integration:
    name: Backend Integration (Postgres)
    runs-on: ubuntu-latest
    # 40, not 25: the suite re-runs every in-memory test beside the Postgres ones and took
    # 7 of its 10 minutes before the doors console added 146 tests; at 10 it was cancelled
    # mid-run, which reads as a failure and names no test.
    #
    # 25 stopped being enough when the coverage gate moved here, because collecting coverage
    # instruments every line: the same 2210 tests take 12m34s without it and 17m with, a 35%
    # overhead measured on a developer machine and worse on a shared runner. At 25 this job
    # was killed a few minutes from the end, and a job killed by its own timeout reports as
    # CANCELLED rather than failed — so it names no test, points at nothing, and reads like a
    # hang. That is the most expensive kind of red there is, and it is worth paying for
    # headroom to never see it again.
    timeout-minutes: 40
    needs: [backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crusaders
          POSTGRES_PASSWORD: crusaders_test_pw
          POSTGRES_DB: crusaders_mainframe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crusaders"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./src/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Crusaders.Mainframe.Tests/Crusaders.Mainframe.Tests.csproj

      - name: Run integration tests against Postgres
        env:
          API_BOUNDARY_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=crusaders_mainframe_test;Username=crusaders;Password=crusaders_test_pw
          # Asserts the boundary tests actually run here rather than skipping quietly.
          REQUIRE_BOUNDARY_TESTS: "true"
        # No --filter: xUnit collections are not filterable by name, and a
        # class-name list rots the day a new Postgres-backed class is added —
        # which is exactly how the postgres-http tier silently ran in CI never.
        # The in-memory tests re-run here; the `backend` job stays the fast gate.
        run: dotnet test Crusaders.Mainframe.Tests/Crusaders.Mainframe.Tests.csproj --nologo -v q --settings coverlet.runsettings --results-directory ./TestResults

      # THE COVERAGE GATE LIVES HERE, not on the fast `backend` job, because this is the only
      # tier that runs the whole suite. Measured on a run where every Postgres-backed test
      # skipped, the same rule reported 63.2% and failed a release whose real coverage nobody
      # had measured — the gate was reading how much of the product is reachable without a
      # database, which is not a property anybody intends to hold a line on.
      - name: Enforce coverage threshold
        run: |
          THRESHOLD=70
          REPORT=$(find ./TestResults -name "coverage.cobertura.xml" | head -1)
          if [ -z "$REPORT" ]; then
            echo "No coverage report produced — the collector did not run."
            echo "This used to exit 0, which meant the gate passed whenever it broke."
            exit 1
          fi
          line_rate=$(grep -oP 'line-rate="\K[^"]+' "$REPORT" | head -1)
          coverage=$(awk "BEGIN {printf \"%.1f\", $line_rate * 100}")
          echo "Line coverage: ${coverage}% (threshold: ${THRESHOLD}%)"
          if [ "$(awk "BEGIN {print ($coverage < $THRESHOLD)}")" -eq 1 ]; then
            echo "Coverage ${coverage}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi

  # ============================================================================
  # IoT firmware — host-compiled unit tests, no hardware required.
  #
  # Deliberately has no `needs:`. The backend job carries pre-existing failures,
  # and chaining firmware behind it would mean the firmware gate never runs.
  # ============================================================================
  iot:
    name: IoT Firmware (native tests + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/iot/requirements.txt

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('src/iot/*/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install pinned toolchain
        run: pip install -r src/iot/requirements.txt

      - name: Formatting (clang-format)
        run: |
          # Must be the pinned pip build, not the OS one — versions format differently.
          # Every iot project's sources; the generated sketch folders are excluded
          # because they hold machine-rewritten copies of these same files plus two
          # vendored libraries, and the originals are already in this list.
          clang-format --version
          clang-format --dry-run -Werror $(git ls-files -co --exclude-standard 'src/iot/**/*.cpp' 'src/iot/**/*.h' ':(exclude)src/iot/*/arduino/**')

      # Covers EVERY project under src/iot, not just the one it lives in: the
      # shared libraries are compiled into all of them, so a gate scoped to one
      # firmware would leave the widest blast radius unchecked. No argument =
      # every sibling with a platformio.ini and a lib/.
      - name: Strict compile — full pedantic set as errors
        run: src/iot/court-box/tools/strict_compile.sh

      # The exclusions are the HAL-IMPLEMENTATION directories, by name: one per
      # board family plus one per SIMULATOR. A new firmware's HAL has to be added
      # here, to the same list in the Makefile's lint-iot, and to the one in
      # strict_compile.sh. `--exclude-dir` matches a whole directory name, so
      # posix_gate_hal needs its own entry and is not covered by posix_hal's.
      #
      # The header families are per board family too. ESP32 brought four the
      # ESP8266 never had — HTTPClient, Preferences, HardwareSerial and the whole
      # esp_* / driver/ / soc/ IDF set — and a regex that only knew the 8266's
      # would have let an esp_task_wdt.h into pure lib/ and broken the host build
      # of every project at once.
      - name: Purity gate — pure lib/ must not include Arduino headers
        run: |
          if grep -rn --include=*.h --include=*.cpp \
               -E '#include *<(Arduino|WiFi|ESP8266|Wire|LiquidCrystal|HTTPClient|Preferences|HardwareSerial|EEPROM|SPI|esp_|driver/|soc/)' \
               src/iot/shared/lib src/iot/court-box/lib src/iot/door-gate/lib \
               --exclude-dir=arduino_hal --exclude-dir=posix_hal --exclude-dir=esp32_hal \
               --exclude-dir=posix_gate_hal; then
            echo "::error::pure lib/ modules must stay free of Arduino headers so they compile for the host"
            exit 1
          fi

      # Defence in depth only. The PRIMARY defence is that tb::Deadline keeps its
      # `at` field private, so `now >= d.at` does not compile.
      #
      # This gate is name-based and was therefore blind to exactly the bug it
      # exists for: a mutation reintroducing `d.isArmed() && now >= d.at` — the
      # deleted sketch's bug, verbatim — passed it silently, because `at` matches
      # none of the identifier patterns. Only a test at the wrap caught it. The
      # millis() and `.at` alternatives below close that specific hole, but the
      # lesson stands: a regex guessing at names cannot be the real guard.
      - name: Rollover gate — no raw deadline comparisons
        run: |
          if grep -rnE '(>=|<=|>|<) *[A-Za-z_]*([Dd]eadline|[Ee]xpires|[Aa]tMs)|millis\(\) *(>=|<=|>|<)|(>=|<=|>|<) *millis\(\)|(>=|<=|>|<) *[A-Za-z_][A-Za-z0-9_]*\.at\b' \
               src/iot/shared/lib src/iot/court-box/lib src/iot/court-box/src \
               src/iot/door-gate/lib src/iot/door-gate/src \
               --include=*.cpp --include=*.h 2>/dev/null \
               | grep -v 'lib/timebase'; then
            echo "::error::use tb::reached() or tb::Deadline — a direct comparison breaks at the 49.7-day millis() wrap"
            exit 1
          fi

      - name: Generated corpus files are current
        # One copy of the gate: the Makefile target owns the generators and the
        # file list; CI only overrides PY since the pinned toolchain is on PATH
        # here. BOTH families are covered — the court box's baked header and the
        # gate's cases.json/manifest.json, which are generated in the opposite
        # direction and were checked by nothing until round G1.
        run: make corpus-check PY=python3

      # BOTH projects. `shared` carries the device-agnostic libraries every
      # firmware compiles, `court-box` the box's own; running one of the two
      # proves half the firmware. The Makefile's IOT_PROJECTS list is the single
      # place a third project is added.
      - name: Unit tests (host)
        run: make test-iot PIO=pio PY=python3

      - name: Unit tests under ASAN + UBSAN
        run: make test-iot-asan PIO=pio PY=python3

      - name: Complexity (C++, C# and TypeScript)
        run: |
          lizard src/iot/shared/lib src/iot/court-box/lib src/iot/court-box/src \
            src/iot/door-gate/lib src/iot/door-gate/src \
            src/backend/Crusaders.Mainframe.Api src/frontend/src \
            -C 15 -L 200 -a 6 -W whitelizard.txt \
            -x '*/Migrations/*' -x '*/node_modules/*' -x '*/.pio/*' -x '*/.venv/*' \
            -x '*/bin/*' -x '*/obj/*' -x '*.test.tsx' -x '*.test.ts' -w

  # ============================================================================
  # IoT firmware — compile every target board plus the native simulator.
  #
  # Separate from the `iot` job above because it proves a different thing. That
  # one runs `pio test`, which builds lib/ and test/ for the HOST only: it never
  # touches lib/arduino_hal/, never resolves a board dependency, and never links
  # for AVR or Xtensa. tools/strict_compile.sh excludes those two directories on
  # the stated grounds that `pio run` covers them — which was not true while
  # `pio run` did not work, and this job is what makes it true.
  #
  # The failure it would have caught: [env:court_mega] pinned a LiquidCrystal_I2C
  # coordinate that has never existed in the PlatformIO registry, so every board
  # build failed at dependency resolution. Nothing in CI ran `pio run`, so
  # nothing went red, for as long as that has been in the file.
  #
  # Deliberately has no `needs:`, matching the `iot` job: the backend carries
  # pre-existing failures and chaining the firmware behind it would mean the
  # firmware gate never runs.
  # ============================================================================
  iot-build:
    name: IoT Firmware (board builds)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/iot/requirements.txt

      # A separate cache entry from the `iot` job's on purpose. This one holds
      # the AVR and Xtensa toolchains and the board framework packages, which
      # are hundreds of megabytes the host-test job has no use for; sharing one
      # key would make the two jobs fight over what the entry contains.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-boards-${{ runner.os }}-${{ hashFiles('src/iot/*/platformio.ini') }}
          restore-keys: pio-boards-${{ runner.os }}-

      - name: Install pinned toolchain
        run: pip install -r src/iot/requirements.txt

      # court_bridge and door_gate both #error without their project's own
      # secrets.h, and secrets.h is gitignored because it holds a real WiFi
      # password and the club's device API key. CI has neither and needs neither:
      # the four values only have to EXIST for the preprocessor, and a build made
      # from them is a compile check, never an artifact anybody flashes. Written
      # here rather than committed as an example copy so that a developer who
      # forgets their own still gets the #error.
      #
      # AND THEY MAY NOT BE THE EXAMPLE FILE'S VALUES. Since round G3 the gate
      # `static_assert`s every one of the four against `secrets.h.example`'s
      # placeholder and refuses `0.0.0.0` as a base-URL host, so an unedited
      # example file cannot become an image on a wall. These values are
      # deliberately unmistakable: 192.0.2.0/24 is RFC 5737's TEST-NET-1, which
      # exists to be written down and never routed.
      #
      # ONE FILE PER PROJECT. They are not shared and must not be: a symlink or a
      # single file reached from both would make a change to one board's
      # credentials a change to the other's. The court box has no such guard and
      # is unaffected by the values; it gets the same file because one loop is
      # easier to keep true than two.
      - name: Write a throwaway secrets.h for each board project
        run: |
          set -euo pipefail
          for project in court-box door-gate; do
            cat > "src/iot/$project/src/common/secrets.h" <<'SECRETS'
          #pragma once
          #define WIFI_SSID "ci-build-only"
          #define WIFI_PASSWORD "ci-build-only"
          #define API_BASE_URL "http://192.0.2.10:8088"
          #define DEVICE_API_KEY "ci-build-only-not-a-real-key"
          SECRETS
          done

      - name: Build court_mega, court_bridge and the simulator
        run: pio run -d src/iot/court-box -e court_mega -e court_bridge -e simulator

      # A separate step from the court box's so a red gate names the board that
      # broke. The espressif32 platform is a few hundred megabytes of Xtensa
      # toolchain on a cold cache; the pio-boards cache entry above is keyed on
      # every project's platformio.ini, so a pin change is what re-downloads it.
      - name: Build door_gate and the door simulator
        run: pio run -d src/iot/door-gate -e door_gate -e simulator

      # The Arduino IDE is the DEPLOYMENT route for EVERY board here and both
      # arduino/ trees are generated, so a source or platformio.ini change that was
      # not re-exported would leave a technician flashing last week's firmware from a
      # folder that looks current. One target, both projects.
      - name: Arduino sketches are current
        run: make arduino-check PIO=pio PY=python3

      # Keyed on EVERY project's arduino-cli.yaml, not just the court box's. Each
      # of those files carries its project's core pins in a comment, so a pin
      # change is what re-downloads the cores — and a key naming only one project
      # would have served a stale cache after the gate's pin moved.
      - name: Cache the Arduino cores
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-cores-${{ runner.os }}-${{ hashFiles('src/iot/*/arduino/arduino-cli.yaml') }}

      - name: Compile every sketch with the Arduino toolchain
        run: |
          set -euo pipefail
          ESP8266_URL=https://arduino.esp8266.com/stable/package_esp8266com_index.json
          ESP32_URL=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          # The installer REFUSES to create its own BINDIR — "folder not found. Please create
          # it before continuing." — and exits 1 without installing anything.
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR="$RUNNER_TEMP/bin" sh
          export PATH="$RUNNER_TEMP/bin:$PATH"
          # Every core is PINNED to match the PlatformIO platform beside it:
          # framework-arduino-avr 5.2.0 is core 1.8.6, framework-arduinoespressif8266
          # 3.30102.0 is 3.1.2, and framework-arduinoespressif32 3.20017 — which is
          # what espressif32@6.9.0 resolves — is core 2.0.17. Only ONE version of a
          # core installs at a time, so an unpinned install here is a different
          # firmware from the tested one with nothing to say so.
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.6
          arduino-cli core update-index --additional-urls "$ESP8266_URL"
          arduino-cli core install esp8266:esp8266@3.1.2 --additional-urls "$ESP8266_URL"
          arduino-cli core update-index --additional-urls "$ESP32_URL"
          arduino-cli core install esp32:esp32@2.0.17 --additional-urls "$ESP32_URL"
          # Each sketch reads its OWN secrets.h, beside its .ino. Same throwaway
          # values written above; gitignored either way, and removed after.
          cp src/iot/court-box/src/common/secrets.h src/iot/court-box/arduino/court_bridge/secrets.h
          cp src/iot/door-gate/src/common/secrets.h src/iot/door-gate/arduino/door_gate/secrets.h
          arduino-cli compile --fqbn arduino:avr:mega:cpu=atmega2560 src/iot/court-box/arduino/court_mega
          arduino-cli compile --fqbn esp8266:esp8266:generic:eesz=4M2M,xtal=80,baud=115200 src/iot/court-box/arduino/court_bridge
          arduino-cli compile --fqbn esp32:esp32:esp32 src/iot/door-gate/arduino/door_gate
          rm -f src/iot/court-box/arduino/court_bridge/secrets.h \
                src/iot/door-gate/arduino/door_gate/secrets.h

      # The simulator is what the .NET integration tests talk to, so "it links"
      # is not enough — it has to come up and bind its socket. --port 0 asks the
      # kernel for a free one, so this cannot collide with anything on a runner.
      - name: Court-box simulator starts and binds
        run: |
          set -euo pipefail
          out=$(timeout 10s src/iot/court-box/.pio/build/simulator/program \
                  --port 0 --store "$RUNNER_TEMP/simstore" </dev/null || true)
          echo "$out"
          echo "$out" | grep -q '^\[sim\] listening on 127\.0\.0\.1:[0-9]\+$'

      # The door's equivalent, and it asserts the one thing "it links" cannot:
      # that the LOCKED level is in the output register BEFORE the relay pin
      # drives anything. On a board wired the other way round the obvious
      # ordering is a door that clicks open on every boot, and the e2e job below
      # is where the rest of this binary's behaviour is proved.
      #
      # 192.0.2.10 is TEST-NET-1 and answers nothing, which is the point: the
      # startup path being checked runs before the first heartbeat, and a
      # simulator that needed a reachable API to print its banner would be a
      # smoke test that only passes with a server behind it. The key is a
      # throwaway and is read from the environment rather than argv.
      - name: Door simulator starts with the lock asserted LOCKED
        run: |
          set -euo pipefail
          out=$(GATE_DEVICE_KEY=ci-build-only-not-a-real-key timeout 5s \
                  src/iot/door-gate/.pio/build/simulator/program \
                  --api-base http://192.0.2.10:8088 --mac 02d0deadbeef \
                  --store "$RUNNER_TEMP/gatestore" </dev/null || true)
          echo "$out"
          echo "$out" | grep -q '^\[relay\] OFF level=LOW (register only, pin not driving) t='
          echo "$out" | grep -q '^\[relay\] driving, level=LOW (OFF) t='
          echo "$out" | grep -q '^\[sim\] crusaders door-gate simulator 1\.0\.0$'
          # The key must not reach the transcript: CI uploads it as an artifact.
          ! echo "$out" | grep -q 'ci-build-only-not-a-real-key'

  # ============================================================================
  # End-to-end device proof — the real API, a real Postgres, the firmware's native
  # simulator and the PayFast imposter. Two scenarios, one job.
  #
  # `scenario.py` is the COURT BOX and is the only job that proves the box-facing
  # chain end to end (the club key, auto-registration on first heartbeat,
  # activate/events/walk-up, the no-show sweep) against the code as it will ship.
  #
  # `door_evening.py` is the DOOR, and it is the only thing anywhere in this
  # repository that reads a response the way a board does: a raw socket over
  # HTTP/1.0 with `Connection: close`, a second pass over HTTP/1.1 de-chunked by
  # hand on a kept-open connection, and both of those again through a real nginx
  # carrying `nginx/nginx.conf`'s own `/api/` directives. That is why nginx and the
  # Postgres client are installed below and why E2E_REQUIRE_GATEWAY is set: round G3
  # found the API answering every device route `Transfer-Encoding: chunked` on a
  # keep-alive connection, which timed out the firmware's reader on EVERY call — no
  # roster and a door that refused everyone — with nothing red in any suite, because
  # every client in every suite de-chunks for you. A framing regression fails here
  # now instead of at a door.
  #
  # Runs headless: Postgres is the service container below (E2E_PG_HOST/PORT point
  # the scripts at it, so nothing reaches for docker), the simulator is built by pio
  # from the pinned toolchain, mountebank comes from npx. The image builds are gated
  # on it.
  # ============================================================================
  e2e-device:
    name: End-to-end (device chain)
    runs-on: ubuntu-latest
    # Two scenarios now, and the door's own steps wait on the real NoShowWorker and
    # LightsCueWorker rather than short-circuiting them — the BackgroundService
    # timers are part of what is being proved.
    timeout-minutes: 40
    needs: [backend, iot-build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crusaders
          POSTGRES_PASSWORD: crusaders_test_pw
          POSTGRES_DB: crusaders_mainframe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crusaders"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/iot/requirements.txt

      # The same entry iot-build populated: the simulator build reuses the native
      # toolchain instead of downloading it again.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-boards-${{ runner.os }}-${{ hashFiles('src/iot/*/platformio.ini') }}
          restore-keys: pio-boards-${{ runner.os }}-

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install pinned toolchain
        run: pip install -r src/iot/requirements.txt

      # Two things door_evening.py cannot do without, installed by name rather than
      # inherited from whatever the runner image happens to ship this month:
      #
      #   psql        — it places a booking at an hour the admin API will not create,
      #                 which is how a two-hour door window is driven at both of its
      #                 edges inside a four-minute run;
      #   nginx       — the boards do NOT talk to the application, they talk to the
      #                 gateway, and `proxy_http_version 1.1` + `proxy_buffering off`
      #                 is what re-chunks a response to a 1.1 client. No suite in this
      #                 repository has ever put a request through it.
      #
      # E2E_REQUIRE_GATEWAY below turns a missing nginx into a FAILED assertion rather
      # than a printed note, because a gate that never runs is indistinguishable from
      # one that always passes — this repository has shipped three of those.
      - name: Install the gateway and the Postgres client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nginx-light postgresql-client

      - name: Restore backend
        run: dotnet restore src/backend/Crusaders.Mainframe.Api/Crusaders.Mainframe.Api.csproj

      # PIO/PY on PATH here rather than in the per-checkout venv the Makefile defaults
      # to, exactly as the `iot` job overrides them for corpus-check.
      - name: Run the device end-to-end proof (court box, then door)
        env:
          E2E_PG_HOST: localhost
          E2E_PG_PORT: "5432"
          E2E_PG_USER: crusaders
          E2E_PG_PASSWORD: crusaders_test_pw
          E2E_REQUIRE_GATEWAY: "1"
        run: make test-e2e-device PIO=pio PY=python3

      # Both scenarios write under .tmp/e2e-device/ (the door adds a `-door` suffix to
      # its run directory), and both empty it on a pass, so anything here is evidence
      # from a failure: the API log, the gateway's own error log, and the exchanges.
      - name: Upload scenario scratch on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-device-scratch
          path: .tmp/e2e-device/
          retention-days: 7
          if-no-files-found: ignore

  # ============================================================================
  # Security — npm audit + dotnet vulnerable package scan
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ./src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./src/frontend
        run: npm ci

      - name: npm audit (high severity)
        working-directory: ./src/frontend
        run: npm audit --audit-level=high

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore backend packages
        working-directory: ./src/backend
        run: dotnet restore

      - name: Check vulnerable NuGet packages
        working-directory: ./src/backend
        run: |
          set -euo pipefail
          dotnet list package --vulnerable --include-transitive --format json > vulnerable-packages.json
          node -e "
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('vulnerable-packages.json', 'utf8'));
            const projects = report.projects || [];
            const vulnerable = [];
            for (const project of projects) {
              for (const framework of project.frameworks || []) {
                for (const pkg of framework.topLevelPackages || []) {
                  if ((pkg.vulnerabilities || []).length > 0) vulnerable.push(pkg);
                }
                for (const pkg of framework.transitivePackages || []) {
                  if ((pkg.vulnerabilities || []).length > 0) vulnerable.push(pkg);
                }
              }
            }
            if (vulnerable.length > 0) {
              console.error('Vulnerable NuGet packages detected:');
              for (const pkg of vulnerable) {
                const ids = (pkg.vulnerabilities || []).map(v => v.severity + ':' + v.advisoryUrl).join(', ');
                console.error('- ' + pkg.id + ' ' + pkg.resolvedVersion + ' -> ' + ids);
              }
              process.exit(1);
            }
            console.log('No vulnerable NuGet packages detected');
          "

  # ============================================================================
  # Docker Build & Push — only on push to main, after CI passes
  # ============================================================================
  build-backend-amd64:
    name: Build Backend (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, frontend, e2e, e2e-device, backend-integration, iot, iot-build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-backend:latest-amd64

  build-backend-arm64:
    name: Build Backend (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    needs: [backend, frontend, e2e, e2e-device, backend-integration, iot, iot-build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend (arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/backend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-backend:latest-arm64

  merge-backend-manifests:
    name: Create Backend Multi-arch Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-backend-amd64, build-backend-arm64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create -t ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-backend:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-backend:latest-amd64 \
            ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-backend:latest-arm64

  build-frontend-amd64:
    name: Build Frontend (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, frontend, e2e, e2e-device, backend-integration, iot, iot-build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-frontend:latest-amd64
          build-args: |
            BUILD_SHA=${{ github.sha }}

  build-frontend-arm64:
    name: Build Frontend (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    needs: [backend, frontend, e2e, e2e-device, backend-integration, iot, iot-build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend (arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/frontend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-frontend:latest-arm64
          build-args: |
            BUILD_SHA=${{ github.sha }}

  merge-frontend-manifests:
    name: Create Frontend Multi-arch Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-frontend-amd64, build-frontend-arm64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
