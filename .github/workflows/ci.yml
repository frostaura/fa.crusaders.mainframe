            ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-frontend:latest-arm64

  # ============================================================================
  # Gateway — the nginx reverse proxy, as an image rather than a bind mount.
  #
  # nginx/nginx.conf carries the X-Forwarded-Host that gives every member their own
  # rate-limit bucket rather than one bucket for the club.
  # It used to be mounted into stock nginx:alpine from a checkout on the
  # host, and a redeploy moves images and nothing else — so a club merging a
  # gateway fix got a new backend behind the OLD config, with nothing anywhere
  # saying so (round-3 finding 18). Built and pushed like the other two now, so the
  # trap cannot recur on the next nginx.conf edit either.
  #
  # THIS WORKFLOW PUBLISHES AND STOPS. There is no redeploy job: the Portainer one
  # was removed 2026-09-19 by decision, along with the four PORTAINER_* secrets it
  # was the only reader of. Pulling these images onto the club machine is a MANUAL
  # step, and the two checks that job used to make before deploying — that the
  # stack names the gateway image, and that it no longer bind-mounts
  # nginx/nginx.conf — are now made by hand, every time. Neither mistake is
  # visible any other way; see docs/go-live-checklist.md §2.
  # ============================================================================
  build-gateway-amd64:
    name: Build Gateway (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, frontend, e2e, e2e-device, backend-integration, iot, iot-build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push gateway (amd64)
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-gateway:latest-amd64

  build-gateway-arm64:
    name: Build Gateway (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    needs: [backend, frontend, e2e, e2e-device, backend-integration, iot, iot-build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push gateway (arm64)
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-gateway:latest-arm64

  merge-gateway-manifests:
    name: Create Gateway Multi-arch Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-gateway-amd64, build-gateway-arm64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create -t ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-gateway:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-gateway:latest-amd64 \
            ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-gateway:latest-arm64
