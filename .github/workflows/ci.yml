          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push gateway (arm64)
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-gateway:latest-arm64

  merge-gateway-manifests:
    name: Create Gateway Multi-arch Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-gateway-amd64, build-gateway-arm64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create -t ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-gateway:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-gateway:latest-amd64 \
            ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-gateway:latest-arm64

  # ============================================================================
  # Portainer deploy — re-pull images and redeploy the live stack
  # ============================================================================
  deploy-portainer:
    name: Re-pull image and redeploy on Portainer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [merge-backend-manifests, merge-frontend-manifests, merge-gateway-manifests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Wait for Docker Hub propagation
        run: |
          echo "Sleeping 30s to let Docker Hub propagate the freshly pushed manifests."
          sleep 30

      - name: Trigger Portainer re-pull and redeploy
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
          # Needed to name the gateway image in the stack check below.
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          : "${PORTAINER_URL:?secret PORTAINER_URL is required}"
          : "${PORTAINER_TOKEN:?secret PORTAINER_TOKEN is required}"
          : "${PORTAINER_ENDPOINT_ID:?secret PORTAINER_ENDPOINT_ID is required}"
          : "${PORTAINER_STACK_ID:?secret PORTAINER_STACK_ID is required}"
          : "${DOCKERHUB_USERNAME:?secret DOCKERHUB_USERNAME is required}"

          api="${PORTAINER_URL%/}/api"

          echo "Fetching current stack file content..."
          stack_file_content=$(curl -fsSL \
            -H "X-API-Key: ${PORTAINER_TOKEN}" \
            "${api}/stacks/${PORTAINER_STACK_ID}/file" \
            | jq -r '.StackFileContent')

          # The deploy is a re-PUT of the stack Portainer already holds with
          # pullImage: true. That re-pulls the images the stack NAMES — so a stack still
          # naming stock nginx:alpine with ./nginx/nginx.conf bind-mounted silently keeps
          # the old gateway config while reporting a successful deploy, which is exactly
          # how the /firmware/ route and the forwarded host would have been stranded
          # (round-3 finding 18). Checked here, against the live stack, because nothing
          # else in the chain can see it: the tests exercise the API given forwarded
          # headers and cannot tell a stale deployed gateway from a fresh one.
          gateway_image="${DOCKERHUB_USERNAME}/crusaders-mainframe-gateway"
          stack_ok=1
          if ! printf '%s' "${stack_file_content}" | grep -q "${gateway_image}"; then
            echo "::error title=Portainer stack does not name the gateway image::the live stack has no '${gateway_image}' service. The gateway is built and pushed by this workflow; a stack that does not name it will keep whatever gateway it has, config included."
            stack_ok=0
          fi
          if printf '%s' "${stack_file_content}" | grep -q 'nginx/nginx\.conf'; then
            echo "::error title=Portainer stack bind-mounts nginx.conf::the live stack still mounts ./nginx/nginx.conf from a host checkout. That file is baked into the gateway image now; a bind mount silently overrides it with whatever is on the host and pins the club to a config the release cannot update."
            stack_ok=0
          fi
          if [ "${stack_ok}" -ne 1 ]; then
            echo "Refusing to deploy. Point the Portainer stack's gateway service at ${gateway_image}:latest and remove the nginx.conf volume; see docs/specs/deployment.md."
            exit 1
          fi

          echo "Fetching current stack metadata..."
          env_array=$(curl -fsSL \
            -H "X-API-Key: ${PORTAINER_TOKEN}" \
            "${api}/stacks/${PORTAINER_STACK_ID}" \
            | jq -c '.Env // []')

          echo "Submitting update with pullImage=true..."
          body=$(jq -n \
            --arg sfc "${stack_file_content}" \
            --argjson env "${env_array}" \
            '{stackFileContent: $sfc, env: $env, prune: false, pullImage: true}')

          http_code=$(curl -sS -o /tmp/portainer-resp.json -w "%{http_code}" \
            -X PUT "${api}/stacks/${PORTAINER_STACK_ID}?endpointId=${PORTAINER_ENDPOINT_ID}" \
            -H "X-API-Key: ${PORTAINER_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${body}")

          echo "Portainer responded with HTTP ${http_code}"
          if [ "${http_code}" -ge 400 ]; then
            cat /tmp/portainer-resp.json
            exit 1
          fi
          echo "Stack ${PORTAINER_STACK_ID} redeployed successfully."
