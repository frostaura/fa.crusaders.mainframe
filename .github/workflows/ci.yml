name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================================
  # Backend — lint, build, test (.NET 10)
  # ============================================================================
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./src/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: |
          dotnet restore Crusaders.Mainframe.Api/Crusaders.Mainframe.Api.csproj
          dotnet restore Crusaders.Mainframe.Tests/Crusaders.Mainframe.Tests.csproj

      - name: Build
        run: |
          dotnet build Crusaders.Mainframe.Api/Crusaders.Mainframe.Api.csproj --nologo -v q
          dotnet build Crusaders.Mainframe.Tests/Crusaders.Mainframe.Tests.csproj --nologo -v q

      - name: Test with coverage
        run: dotnet test Crusaders.Mainframe.Tests/Crusaders.Mainframe.Tests.csproj --nologo -v q --settings coverlet.runsettings --results-directory ./TestResults

      - name: Enforce coverage threshold
        run: |
          THRESHOLD=70
          REPORT=$(find ./TestResults -name "coverage.cobertura.xml" | head -1)
          if [ -z "$REPORT" ]; then
            echo "No coverage report produced — the collector did not run."
            echo "This used to exit 0, which meant the gate passed whenever it broke."
            exit 1
          fi
          line_rate=$(grep -oP 'line-rate="\K[^"]+' "$REPORT" | head -1)
          coverage=$(awk "BEGIN {printf \"%.1f\", $line_rate * 100}")
          echo "Line coverage: ${coverage}% (threshold: ${THRESHOLD}%)"
          if [ "$(awk "BEGIN {print ($coverage < $THRESHOLD)}")" -eq 1 ]; then
            echo "Coverage ${coverage}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi

  # ============================================================================
  # Frontend — lint, build, test (Node 22 / React 19 / Vite 7)
  # ============================================================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./src/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ./src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --run

  # ============================================================================
  # End-to-end — the real built frontend in a real browser
  #
  # A separate job from `frontend` on purpose: it needs a browser download and a dev
  # server, and folding that into the fast unit job would slow every push for a check
  # that answers a different question. What it catches is what a unit test cannot —
  # that the screens compose, navigate, and put the right numbers in front of a
  # person. The API is intercepted; the server's own behaviour is held by the backend
  # and backend-integration jobs.
  # ============================================================================
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend]
    defaults:
      run:
        working-directory: ./src/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ./src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --with-deps because a bare GitHub runner is missing the shared libraries
      # Chromium needs, and the failure is a launch error that reads as a Playwright
      # bug rather than as a missing apt package.
      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npx playwright test

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/playwright-report/
          retention-days: 7

  # ============================================================================
  # Backend Integration — real Postgres boundary checks (no EF in-memory)
  # ============================================================================
  backend-integration:
    name: Backend Integration (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crusaders
          POSTGRES_PASSWORD: crusaders_test_pw
          POSTGRES_DB: crusaders_mainframe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crusaders"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./src/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Crusaders.Mainframe.Tests/Crusaders.Mainframe.Tests.csproj

      - name: Run integration tests against Postgres
        env:
          API_BOUNDARY_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=crusaders_mainframe_test;Username=crusaders;Password=crusaders_test_pw
          # Asserts the boundary tests actually run here rather than skipping quietly.
          REQUIRE_BOUNDARY_TESTS: "true"
        # No --filter: xUnit collections are not filterable by name, and a
        # class-name list rots the day a new Postgres-backed class is added —
        # which is exactly how the postgres-http tier silently ran in CI never.
        # The in-memory tests re-run here; the `backend` job stays the fast gate.
        run: dotnet test Crusaders.Mainframe.Tests/Crusaders.Mainframe.Tests.csproj --nologo -v q

  # ============================================================================
  # IoT firmware — host-compiled unit tests, no hardware required.
  #
  # Deliberately has no `needs:`. The backend job carries pre-existing failures,
  # and chaining firmware behind it would mean the firmware gate never runs.
  # ============================================================================
  iot:
    name: IoT Firmware (native tests + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/iot/requirements.txt

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('src/iot/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install pinned toolchain
        run: pip install -r src/iot/requirements.txt

      - name: Formatting (clang-format)
        run: |
          # Must be the pinned pip build, not the OS one — versions format differently.
          clang-format --version
          clang-format --dry-run -Werror $(git ls-files -co --exclude-standard 'src/iot/**/*.cpp' 'src/iot/**/*.h')

      - name: Strict compile — full pedantic set as errors
        run: src/iot/tools/strict_compile.sh

      - name: Purity gate — pure lib/ must not include Arduino headers
        run: |
          if grep -rn --include=*.h --include=*.cpp \
               -E '#include *<(Arduino|WiFi|ESP8266|Wire|LiquidCrystal)' \
               src/iot/lib --exclude-dir=arduino_hal --exclude-dir=posix_hal; then
            echo "::error::pure lib/ modules must stay free of Arduino headers so they compile for the host"
            exit 1
          fi

      # Defence in depth only. The PRIMARY defence is that tb::Deadline keeps its
      # `at` field private, so `now >= d.at` does not compile.
      #
      # This gate is name-based and was therefore blind to exactly the bug it
      # exists for: a mutation reintroducing `d.isArmed() && now >= d.at` — the
      # deleted sketch's bug, verbatim — passed it silently, because `at` matches
      # none of the identifier patterns. Only a test at the wrap caught it. The
      # millis() and `.at` alternatives below close that specific hole, but the
      # lesson stands: a regex guessing at names cannot be the real guard.
      - name: Rollover gate — no raw deadline comparisons
        run: |
          if grep -rnE '(>=|<=|>|<) *[A-Za-z_]*([Dd]eadline|[Ee]xpires|[Aa]tMs)|millis\(\) *(>=|<=|>|<)|(>=|<=|>|<) *millis\(\)|(>=|<=|>|<) *[A-Za-z_][A-Za-z0-9_]*\.at\b' \
               src/iot/lib src/iot/src --include=*.cpp --include=*.h 2>/dev/null \
               | grep -v 'lib/timebase'; then
            echo "::error::use tb::reached() or tb::Deadline — a direct comparison breaks at the 49.7-day millis() wrap"
            exit 1
          fi

      - name: OTA signer roundtrip
        # The release-signing step is what a board's signature check trusts, so it
        # is a gate. Proves a signed image verifies and a tampered one is rejected.
        run: python3 src/iot/tools/sign_firmware.py --selftest

      - name: Generated corpus headers are current
        # One copy of the gate: the Makefile target owns the generator and file
        # lists; CI only overrides PY since the pinned toolchain is on PATH here.
        run: make corpus-check PY=python3

      - name: Unit tests (host)
        run: pio test -d src/iot -e native

      - name: Unit tests under ASAN + UBSAN
        run: pio test -d src/iot -e native_asan

      - name: Complexity (C++, C# and TypeScript)
        run: |
          lizard src/iot/lib src/iot/src src/backend/Crusaders.Mainframe.Api src/frontend/src \
            -C 15 -L 200 -a 6 -W whitelizard.txt \
            -x '*/Migrations/*' -x '*/node_modules/*' -x '*/.pio/*' -x '*/.venv/*' \
            -x '*/bin/*' -x '*/obj/*' -x '*.test.tsx' -x '*.test.ts' -w

  # ============================================================================
  # IoT firmware — compile every target board plus the native simulator.
  #
  # Separate from the `iot` job above because it proves a different thing. That
  # one runs `pio test`, which builds lib/ and test/ for the HOST only: it never
  # touches lib/arduino_hal/, never resolves a board dependency, and never links
  # for AVR or Xtensa. tools/strict_compile.sh excludes those two directories on
  # the stated grounds that `pio run` covers them — which was not true while
  # `pio run` did not work, and this job is what makes it true.
  #
  # The failure it would have caught: [env:court_mega] pinned a LiquidCrystal_I2C
  # coordinate that has never existed in the PlatformIO registry, so every board
  # build failed at dependency resolution. Nothing in CI ran `pio run`, so
  # nothing went red, for as long as that has been in the file.
  #
  # Deliberately has no `needs:`, matching the `iot` job: the backend carries
  # pre-existing failures and chaining the firmware behind it would mean the
  # firmware gate never runs.
  # ============================================================================
  iot-build:
    name: IoT Firmware (board builds)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/iot/requirements.txt

      # A separate cache entry from the `iot` job's on purpose. This one holds
      # the AVR and Xtensa toolchains and the board framework packages, which
      # are hundreds of megabytes the host-test job has no use for; sharing one
      # key would make the two jobs fight over what the entry contains.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-boards-${{ runner.os }}-${{ hashFiles('src/iot/platformio.ini') }}
          restore-keys: pio-boards-${{ runner.os }}-

      - name: Install pinned toolchain
        run: pip install -r src/iot/requirements.txt

      - name: Build court_mega, court_bridge and the simulator
        run: pio run -d src/iot -e court_mega -e court_bridge -e simulator

      # The simulator is what the .NET integration tests talk to, so "it links"
      # is not enough — it has to come up and bind its socket. --port 0 asks the
      # kernel for a free one, so this cannot collide with anything on a runner.
      - name: Simulator starts and binds
        run: |
          set -euo pipefail
          out=$(timeout 10s src/iot/.pio/build/simulator/program \
                  --port 0 --store "$RUNNER_TEMP/simstore" </dev/null || true)
          echo "$out"
          echo "$out" | grep -q '^\[sim\] listening on 127\.0\.0\.1:[0-9]\+$'

  # ============================================================================
  # IoT firmware — sign the ESP8266 image and package it for the API to serve.
  #
  # This is the release half of OTA. `iot-build` proves every target compiles;
  # this job rebuilds only court_bridge with $OTA_PRIVATE_KEY set, so the
  # post-build hook (src/iot/tools/pio_sign_post.py) appends the RSA-2048/SHA-256
  # trailer the board's verifier trusts, and then packages the result as the
  # `firmware` artifact that build-backend-* bakes into the API image at
  # /app/firmware/ — the path the API serves at /firmware/ and that
  # Ota:Stable:Url points at.
  #
  # The secret is optional so that PRs and forks still get a green run, but an
  # unsigned build is never a SILENT one: the missing key produces a workflow
  # warning here AND a README in the artifact (so the image says why it carries
  # no firmware), because a release that forgot the secret should be discovered
  # in the run log, not when every court box refuses the update. Go-live
  # checklist item 6 is what mints the key.
  #
  # The signer's own roundtrip (sign_firmware.py --selftest) already gates in
  # the `iot` job; it is not repeated here.
  # ============================================================================
  iot-sign:
    name: IoT Firmware (sign + package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [iot-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/iot/requirements.txt

      # Same key as iot-build on purpose: that job has just populated the entry
      # with the Xtensa toolchain and the espressif8266 framework this build needs,
      # so restoring it here is what keeps a second `pio run` from re-downloading
      # hundreds of megabytes.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-boards-${{ runner.os }}-${{ hashFiles('src/iot/platformio.ini') }}
          restore-keys: pio-boards-${{ runner.os }}-

      - name: Install pinned toolchain
        run: pip install -r src/iot/requirements.txt

      # pio_sign_post.py reads $OTA_PRIVATE_KEY as a PATH to a PEM file, and the
      # secret holds the PEM CONTENT, so it has to land on disk first. umask 077
      # keeps it owner-only; $RUNNER_TEMP is wiped when the job ends. The secret is
      # read through an env var, never interpolated into the script text.
      - name: Materialize signing key
        id: key
        env:
          OTA_PRIVATE_KEY_PEM: ${{ secrets.OTA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${OTA_PRIVATE_KEY_PEM:-}" ]; then
            umask 077
            path="$RUNNER_TEMP/ota_private_key.pem"
            printf '%s\n' "$OTA_PRIVATE_KEY_PEM" > "$path"
            # A secret that is set but not a parseable key is an operator error
            # worth failing on now, with a clear message, rather than as an
            # openssl stderr buried inside the SCons post-action.
            if ! openssl pkey -in "$path" -noout 2>/dev/null; then
              echo "::error title=OTA key invalid::OTA_PRIVATE_KEY is set but is not a PEM private key openssl can parse"
              exit 1
            fi
            echo "path=$path" >> "$GITHUB_OUTPUT"
            echo "Signing key materialized; this build will be signed."
          else
            echo "::warning title=OTA unsigned::OTA_PRIVATE_KEY unset — this build cannot be installed over the air (go-live checklist item 6)"
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      # An empty OTA_PRIVATE_KEY is the hook's documented "not set" case: it
      # prints NOT SIGNED and leaves only firmware.bin. A set path that does not
      # exist makes the hook raise, which is the behaviour we want if the step
      # above somehow produced a dangling path.
      - name: Build + sign court_bridge
        env:
          OTA_PRIVATE_KEY: ${{ steps.key.outputs.path }}
        run: pio run -d src/iot -e court_bridge

      # The version comes from the three FW_VERSION_* flags in platformio.ini —
      # the same values the firmware compiles in and reports on heartbeat — read
      # by regex so a bump there is the only edit a release needs. Any flag
      # missing is a hard failure: a manifest with a guessed version would be
      # offered to the fleet as if it were real.
      - name: Package firmware + manifest
        env:
          OTA_PRIVATE_KEY_PATH: ${{ steps.key.outputs.path }}
        run: |
          set -euo pipefail
          ini=src/iot/platformio.ini
          build=src/iot/.pio/build/court_bridge
          out=out/firmware
          mkdir -p "$out"

          # Matches `-DFW_VERSION_MAJOR=1` as its own line of build_flags. Anchored
          # so a same-named flag inside a comment or another env cannot satisfy it.
          # Prints nothing (and does not fail under pipefail) when absent, so the
          # check below is what reports it — an exit inside $(...) would only
          # swallow its own message.
          ver() {
            grep -oE "^[[:space:]]*-DFW_VERSION_$1=[0-9]+" "$ini" | head -1 | sed 's/.*=//' || true
          }
          major=$(ver MAJOR); minor=$(ver MINOR); patch=$(ver PATCH)
          if [ -z "$major" ] || [ -z "$minor" ] || [ -z "$patch" ]; then
            echo "::error title=Firmware version unknown::$ini must define -DFW_VERSION_MAJOR, _MINOR and _PATCH as their own lines in [common] build_flags (found major='$major' minor='$minor' patch='$patch')"
            exit 1
          fi
          version="$major.$minor.$patch"
          echo "Firmware version: $version"

          if [ -f "$build/firmware.signed.bin" ]; then
            cp "$build/firmware.signed.bin" "$out/court_bridge.signed.bin"

            # THE CHECK THAT MAKES A SIGNED BUILD MEAN SOMETHING.
            #
            # Materializing the secret proved only that it parses as a key, never that it
            # is the other half of the public key committed in OtaPublicKey.h. Those are
            # two separate operator acts (set the secret; commit the regenerated header)
            # and the go-live checklist prescribes them separately, so a mismatch is not a
            # remote possibility — it is the default outcome of doing item 6 out of order.
            # A mismatched pair is a perfectly valid image that EVERY board rejects: each
            # one paints UPDATING / DO NOT POWER OFF, downloads ~400 KB, fails the BearSSL
            # verify, paints UPDATE FAILED, and repeats on every heartbeat until somebody
            # reverts the image. Nothing on the Devices page can explain it, because a box
            # in that loop is heartbeating happily and never reports a failed version.
            #
            # So the release runs the board's own verification against the COMMITTED
            # header, here, before anything is published. It also fails when the header is
            # missing, empty or a placeholder — a header that cannot verify anything is not
            # a signed release either. (Round-3 finding 5.)
            python3 src/iot/tools/sign_firmware.py --verify \
              "$out/court_bridge.signed.bin" \
              src/iot/lib/otacore/include/otacore/OtaPublicKey.h \
              || {
                echo "::error title=OTA key mismatch::the signed image does not verify against the committed OtaPublicKey.h — see the message above and go-live checklist item 6"
                exit 1
              }

            size=$(wc -c < "$out/court_bridge.signed.bin" | tr -d '[:space:]')
            printf '{"version":"%s","url":"/firmware/court_bridge.signed.bin","sizeBytes":%s}\n' \
              "$version" "$size" > "$out/firmware.manifest.json"
            echo "Packaged signed firmware ($size bytes):"
            cat "$out/firmware.manifest.json"
          else
            if [ -n "${OTA_PRIVATE_KEY_PATH:-}" ]; then
              # The key was materialized and the build ran, yet nothing was signed.
              # That is a broken hook, not a missing secret, and must not degrade
              # into an "unsigned" artifact that reads as an operator omission.
              echo "::error title=OTA signing failed::key was present but $build/firmware.signed.bin was not produced"
              exit 1
            fi
            {
              echo "UNSIGNED BUILD — no firmware baked into this image."
              echo
              echo "Firmware version $version was compiled but the OTA_PRIVATE_KEY repository"
              echo "secret was unset, so no signed image exists and nothing can be installed"
              echo "over the air from this deployment. Boards flashed over USB are unaffected."
              echo
              echo "See docs/go-live-checklist.md item 6 (mint the signing key, set the secret)"
              echo "and docs/specs/deployment.md (iot-sign job). Workflow run: ${GITHUB_SERVER_URL:-}/${GITHUB_REPOSITORY:-}/actions/runs/${GITHUB_RUN_ID:-}"
            } > "$out/README.txt"
            echo "No signed image — wrote $out/README.txt:"
            cat "$out/README.txt"
          fi
          ls -la "$out"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/firmware/
          retention-days: 90
          if-no-files-found: error

  # ============================================================================
  # End-to-end device proof — the real API, a real Postgres, the firmware's native
  # simulator and the PayFast imposter, driven by test/e2e-device/scenario.py.
  #
  # This is the only job that proves the box-facing chain end to end (discovery,
  # claim, provisioning, signed heartbeat/activate/events/walk-up, the no-show
  # sweep) against the code as it will ship. It existed as a Makefile target and
  # nothing in CI ran it. Runs headless: Postgres is the service container below
  # (E2E_PG_HOST/PORT point the script at it, so it never reaches for docker), the
  # simulator is built by pio from the pinned toolchain, mountebank comes from npx.
  # The image builds are gated on it.
  # ============================================================================
  e2e-device:
    name: End-to-end (device chain)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, iot-build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crusaders
          POSTGRES_PASSWORD: crusaders_test_pw
          POSTGRES_DB: crusaders_mainframe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crusaders"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/iot/requirements.txt

      # The same entry iot-build populated: the simulator build reuses the native
      # toolchain instead of downloading it again.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-boards-${{ runner.os }}-${{ hashFiles('src/iot/platformio.ini') }}
          restore-keys: pio-boards-${{ runner.os }}-

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install pinned toolchain
        run: pip install -r src/iot/requirements.txt

      - name: Restore backend
        run: dotnet restore src/backend/Crusaders.Mainframe.Api/Crusaders.Mainframe.Api.csproj

      # PIO/PY on PATH here rather than in the per-checkout venv the Makefile defaults
      # to, exactly as the `iot` job overrides them for corpus-check.
      - name: Run the device end-to-end proof
        env:
          E2E_PG_HOST: localhost
          E2E_PG_PORT: "5432"
          E2E_PG_USER: crusaders
          E2E_PG_PASSWORD: crusaders_test_pw
        run: make test-e2e-device PIO=pio PY=python3

      - name: Upload scenario scratch on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-device-scratch
          path: .tmp/e2e-device/
          retention-days: 7
          if-no-files-found: ignore

  # ============================================================================
  # Security — npm audit + dotnet vulnerable package scan
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ./src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./src/frontend
        run: npm ci

      - name: npm audit (high severity)
        working-directory: ./src/frontend
        run: npm audit --audit-level=high

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore backend packages
        working-directory: ./src/backend
        run: dotnet restore

      - name: Check vulnerable NuGet packages
        working-directory: ./src/backend
        run: |
          set -euo pipefail
          dotnet list package --vulnerable --include-transitive --format json > vulnerable-packages.json
          node -e "
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('vulnerable-packages.json', 'utf8'));
            const projects = report.projects || [];
            const vulnerable = [];
            for (const project of projects) {
              for (const framework of project.frameworks || []) {
                for (const pkg of framework.topLevelPackages || []) {
                  if ((pkg.vulnerabilities || []).length > 0) vulnerable.push(pkg);
                }
                for (const pkg of framework.transitivePackages || []) {
                  if ((pkg.vulnerabilities || []).length > 0) vulnerable.push(pkg);
                }
              }
            }
            if (vulnerable.length > 0) {
              console.error('Vulnerable NuGet packages detected:');
              for (const pkg of vulnerable) {
                const ids = (pkg.vulnerabilities || []).map(v => v.severity + ':' + v.advisoryUrl).join(', ');
                console.error('- ' + pkg.id + ' ' + pkg.resolvedVersion + ' -> ' + ids);
              }
              process.exit(1);
            }
            console.log('No vulnerable NuGet packages detected');
          "

  # ============================================================================
  # Docker Build & Push — only on push to main, after CI passes
  # ============================================================================
  build-backend-amd64:
    name: Build Backend (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, frontend, e2e, e2e-device, backend-integration, iot, iot-build, iot-sign, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # The checkout carries a placeholder README in firmware-payload/ so a local
      # build has something to COPY. Clear it before the artifact lands, so the
      # image's /app/firmware/ is exactly what iot-sign produced — and the
      # placeholder's "no firmware baked" text never sits beside a signed image.
      - name: Fetch firmware payload from iot-sign
        run: rm -rf firmware-payload && mkdir -p firmware-payload

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware-payload/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-backend:latest-amd64

  build-backend-arm64:
    name: Build Backend (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    needs: [backend, frontend, e2e, e2e-device, backend-integration, iot, iot-build, iot-sign, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Same as the amd64 job: clear the placeholder, then take iot-sign's output.
      - name: Fetch firmware payload from iot-sign
        run: rm -rf firmware-payload && mkdir -p firmware-payload

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware-payload/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend (arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/backend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-backend:latest-arm64

  merge-backend-manifests:
    name: Create Backend Multi-arch Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-backend-amd64, build-backend-arm64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create -t ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-backend:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-backend:latest-amd64 \
            ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-backend:latest-arm64

  build-frontend-amd64:
    name: Build Frontend (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, frontend, e2e, e2e-device, backend-integration, iot, iot-build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-frontend:latest-amd64
          build-args: |
            BUILD_SHA=${{ github.sha }}

  build-frontend-arm64:
    name: Build Frontend (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    needs: [backend, frontend, e2e, e2e-device, backend-integration, iot, iot-build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
