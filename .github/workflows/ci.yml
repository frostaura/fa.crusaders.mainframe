          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create -t ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-frontend:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-frontend:latest-amd64 \
            ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-frontend:latest-arm64

  # ============================================================================
  # Gateway — the nginx reverse proxy, as an image rather than a bind mount.
  #
  # nginx/nginx.conf carries the /firmware/ location and the X-Forwarded-Host that
  # give every court box a reachable OTA URL and every member their own rate-limit
  # bucket. It used to be mounted into stock nginx:alpine from a checkout on the
  # host, and the deploy chain moves images and nothing else — so a club merging a
  # gateway fix got a new backend behind the OLD config while the dashboard said
  # deployed (round-3 finding 18). Built and pushed like the other two now, so the
  # trap cannot recur on the next nginx.conf edit either.
  # ============================================================================
  build-gateway-amd64:
    name: Build Gateway (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, frontend, e2e, e2e-device, backend-integration, iot, iot-build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push gateway (amd64)
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/crusaders-mainframe-gateway:latest-amd64

  build-gateway-arm64:
    name: Build Gateway (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    needs: [backend, frontend, e2e, e2e-device, backend-integration, iot, iot-build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
