# ---- Upstreams, with connection reuse (R18, scalability) ----
#
# Every proxied request used to open a NEW TCP connection to the backend and close it after one
# response (proxy_pass to a bare host:port with nginx's default `Connection: close` upstream). Each
# closed connection parks its local port in TIME_WAIT for 60 s, and this container has ~28,000 of
# them (32768-60999): any sustained ~470 requests a second exhausts the range. A single court box
# flooding /device/events did exactly that on the live stack — `connect() failed (99: Address not
# available)` — and from then on EVERY request, members' logins and reads included, was a 502 for
# as long as the flood lasted, while the flooder never even reached the API's own limiter to be
# told 429. Reproduced in isolation: 2.95 M 502s in 90 s, member reads 151 of 169 failed.
#
# Pooled keep-alive connections remove the churn: requests reuse a small set of open connections,
# no port is spent per request, and the flood reaches the API, whose per-board limiter answers it
# 429 while members keep being served. Three directives make it work and all three are required —
# `keepalive` here, and in EVERY location that proxies to an upstream, `proxy_http_version 1.1`
# plus `proxy_set_header Connection ""` (without the header nginx still sends `Connection: close`
# and the pool is never used).
#
# `keepalive_timeout 60s` sits under Kestrel's own idle keep-alive (130 s), so it is always nginx
# that retires an idle connection, never the backend closing one nginx is about to reuse. SSE is
# unaffected: a stream holds its upstream connection for its life exactly as before, and returns
# it to the pool (or closes it) when it ends.
upstream backend_api {
    server backend:${NGINX_BACKEND_PORT};
    keepalive          64;
    keepalive_requests 10000;
    keepalive_timeout  60s;
}

upstream frontend_spa {
    server frontend:${NGINX_FRONTEND_PORT};
    keepalive          16;
    keepalive_timeout  60s;
}

server {
    listen       80;
    server_name  _;
    client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};

    # ---- Security headers ----
    #
    # The signed-in app used to render in full inside an <iframe> served from any other origin:
    # header, live booking grid, the member's balance chip. A transparent decoy over that frame
    # is a member pressing "Book for 50.00 cr" or "Confirm cancellation", and an admin pressing
    # "Adjust credit", "Suspend member" or "Regenerate key" — each one click, each one money or
    # lights. Nothing on either hop sent X-Frame-Options, a CSP, nosniff or a Referrer-Policy.
    #
    # These sit at server level, and NO location block below carries an add_header of its own,
    # because nginx does not merge them: a single add_header inside a location discards every
    # inherited one. A location that ever needs its own must repeat these four.
    #
    # The upstreams set the same four themselves — the API in Security/SecurityHeaders.cs, the
    # SPA image in src/frontend/nginx.conf — so a deployment that terminates at either of them
    # alone is still covered. proxy_hide_header drops the upstream copy first, so exactly one of
    # each reaches the client instead of a duplicated pair.
    #
    # The CSP is deliberately narrow: no script-src, no form-action. A top-up hands the member to
    # PayFast by cross-origin form post, and a policy that broke paying would be reverted
    # wholesale — taking the framing refusal with it.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Referrer-Policy;

    add_header X-Frame-Options         "DENY"        always;
    add_header X-Content-Type-Options  "nosniff"     always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Referrer-Policy         "no-referrer" always;

    # Nothing is bought by telling a caller which nginx this is.
    server_tokens off;

    # ---- Compression (perf round, 2026-09-30) ----
    #
    # Nothing on either hop compressed: 801 KB of JavaScript and a 275 KB ledger page went out
    # raw. The API's JSON is compressed HERE (the backend does not compress); the SPA's assets
    # arrive already compressed by the frontend image (src/frontend/nginx.conf) and pass through,
    # which is why Accept-Encoding is left on the proxied request. `gzip_proxied any` because
    # cloudflared in front adds a Via header, and nginx compresses nothing for a request with Via
    # unless told to.
    #
    # text/event-stream is NOT in gzip_types, and must never be: gzip holds bytes back until a
    # block fills, so a compressed stream stops streaming — the wallet balance, the control board
    # and the monitoring feed would each arrive late or not at all. text/html is always
    # compressed once gzip is on; it cannot be listed.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        application/json application/problem+json application/javascript text/javascript
                      text/css image/svg+xml font/ttf application/manifest+json text/plain;

    # The backend honours X-Forwarded-For / -Proto / -Host from this gateway (it is in the
    # API's Gateway:TrustedProxies) and rebuilds RemoteIpAddress, Scheme and Host from
    # them. X-Forwarded-Host carries $http_host — host AND port exactly as the client sent
    # them — because nginx's $host strips the port, and a court box that reaches the API
    # at http://<ip>:8088 was otherwise handed provisioning and OTA URLs on port 80, where
    # nothing listens. X-Forwarded-Port is deliberately NOT sent: inside this container
    # $server_port is 80 whatever GATEWAY_PORT publishes, so it would be wrong by
    # construction; the port travels in X-Forwarded-Host instead.

    # API
    location /api/ {
        proxy_pass         http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_buffering    off;
    }

    # Sign-in, refresh and reset: the one family of responses that carries a credential (the
    # access token) beside text a caller chose (the address typed). Compressing those together
    # is the BREACH shape, and they are a few hundred bytes — nothing is saved. Uncompressed.
    location /api/v1/auth/ {
        gzip               off;
        proxy_pass         http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_buffering    off;
    }

    # There is deliberately no /graphql location. There never was a GraphQL endpoint — the
    # backend maps none, and the block that used to sit here proxied to a path that answered
    # 400 tenant_unresolved. It carried websocket Upgrade headers, so it read as a live
    # subscription transport that somebody would eventually be told to debug. Dead config in
    # the file that is baked into the gateway image is worse than no config: it ships, and it
    # describes a system that does not exist.

    # Health passthrough
    location = /healthz {
        proxy_pass         http://backend_api/healthz;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
    }

    # Uploaded media (member photos etc.) — backend serves these as static files.
    location /uploads/ {
        proxy_pass         http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $http_host;
    }

    # Frontend (SPA) — everything else
    location / {
        proxy_pass         http://frontend_spa/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
