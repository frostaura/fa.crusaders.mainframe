server {
    listen       80;
    server_name  _;
    client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};

    # API + GraphQL
    location /api/ {
        proxy_pass         http://backend:${NGINX_BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
    }

    location /graphql {
        proxy_pass         http://backend:${NGINX_BACKEND_PORT}/graphql;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Health passthrough
    location = /healthz {
        proxy_pass http://backend:${NGINX_BACKEND_PORT}/healthz;
    }

    # Uploaded media (member photos etc.) — backend serves these as static files.
    location /uploads/ {
        proxy_pass         http://backend:${NGINX_BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Frontend (SPA) — everything else
    location / {
        proxy_pass         http://frontend:${NGINX_FRONTEND_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
