server {
    listen       80;
    server_name  _;
    client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};

    # ---- Security headers ----
    #
    # The signed-in app used to render in full inside an <iframe> served from any other origin:
    # header, live booking grid, the member's balance chip. A transparent decoy over that frame
    # is a member pressing "Book for 50.00 cr" or "Confirm cancellation", and an admin pressing
    # "Adjust credit", "Suspend member" or "Regenerate key" — each one click, each one money or
    # lights. Nothing on either hop sent X-Frame-Options, a CSP, nosniff or a Referrer-Policy.
    #
    # These sit at server level, and NO location block below carries an add_header of its own,
    # because nginx does not merge them: a single add_header inside a location discards every
    # inherited one. A location that ever needs its own must repeat these four.
    #
    # The upstreams set the same four themselves — the API in Security/SecurityHeaders.cs, the
    # SPA image in src/frontend/nginx.conf — so a deployment that terminates at either of them
    # alone is still covered. proxy_hide_header drops the upstream copy first, so exactly one of
    # each reaches the client instead of a duplicated pair.
    #
    # The CSP is deliberately narrow: no script-src, no form-action. A top-up hands the member to
    # PayFast by cross-origin form post, and a policy that broke paying would be reverted
    # wholesale — taking the framing refusal with it.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Referrer-Policy;

    add_header X-Frame-Options         "DENY"        always;
    add_header X-Content-Type-Options  "nosniff"     always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Referrer-Policy         "no-referrer" always;

    # Nothing is bought by telling a caller which nginx this is.
    server_tokens off;

    # The backend honours X-Forwarded-For / -Proto / -Host from this gateway (it is in the
    # API's Gateway:TrustedProxies) and rebuilds RemoteIpAddress, Scheme and Host from
    # them. X-Forwarded-Host carries $http_host — host AND port exactly as the client sent
    # them — because nginx's $host strips the port, and a court box that reaches the API
    # at http://<ip>:8088 was otherwise handed provisioning and OTA URLs on port 80, where
    # nothing listens. X-Forwarded-Port is deliberately NOT sent: inside this container
    # $server_port is 80 whatever GATEWAY_PORT publishes, so it would be wrong by
    # construction; the port travels in X-Forwarded-Host instead.

    # API
    location /api/ {
        proxy_pass         http://backend:${NGINX_BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_buffering    off;
    }

    # There is deliberately no /graphql location. There never was a GraphQL endpoint — the
    # backend maps none, and the block that used to sit here proxied to a path that answered
    # 400 tenant_unresolved. It carried websocket Upgrade headers, so it read as a live
    # subscription transport that somebody would eventually be told to debug. Dead config in
    # the file that is baked into the gateway image is worse than no config: it ships, and it
    # describes a system that does not exist.

    # Health passthrough
    location = /healthz {
        proxy_pass http://backend:${NGINX_BACKEND_PORT}/healthz;
    }

    # Uploaded media (member photos etc.) — backend serves these as static files.
    location /uploads/ {
        proxy_pass         http://backend:${NGINX_BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $http_host;
    }

    # Frontend (SPA) — everything else
    location / {
        proxy_pass         http://frontend:${NGINX_FRONTEND_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
